<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#16717F">
<title>Vokabel-Zehner</title>
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one centred column (max 880px) on squared exercise-book paper; sticky bar with name + lesson timer; tiles wrap to two columns on iPad portrait/phones */
:root{
  --paper:#F3F7F5; --card:#FFFFFF; --ink:#17323D; --muted:#58707A; --line:#D3E1DE;
  --primary:#16717F; --primary-ink:#FFFFFF; --primary-deep:#0F5560; --primary-soft:#DCEEF0;
  --sun:#E9A912; --sun-soft:#FCEFC9;
  --good:#23855A; --good-soft:#DDF2E6; --bad:#C94B36; --bad-soft:#F9E1DB; --warn:#A85F08; --warn-soft:#FBEBD3;
  --grid:rgba(22,113,127,.075); --scrim:rgba(10,30,36,.55);
  --torch-bg:#0D171D; --torch-word:#F4E6BC; --torch-found:#FFC93C;
  --f-display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1D24; --card:#172A33; --ink:#E6F0EE; --muted:#95ACB3; --line:#2A434D;
  --primary:#3FA9B8; --primary-ink:#06222A; --primary-deep:#2A7E8A; --primary-soft:#173B44;
  --sun:#F2BE3A; --sun-soft:#3A3219;
  --good:#4FC285; --good-soft:#163828; --bad:#F07A63; --bad-soft:#3E1F1A; --warn:#F0A54A; --warn-soft:#3A2A14;
  --grid:rgba(120,200,210,.05); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1D24; --card:#172A33; --ink:#E6F0EE; --muted:#95ACB3; --line:#2A434D;
  --primary:#3FA9B8; --primary-ink:#06222A; --primary-deep:#2A7E8A; --primary-soft:#173B44;
  --sun:#F2BE3A; --sun-soft:#3A3219;
  --good:#4FC285; --good-soft:#163828; --bad:#F07A63; --bad-soft:#3E1F1A; --warn:#F0A54A; --warn-soft:#3A2A14;
  --grid:rgba(120,200,210,.05); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:400 17px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.shell{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.04;font-weight:800}
h2{font-size:1.55rem;font-weight:800;line-height:1.15}
h3{font-size:1.25rem;font-weight:800}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.lead{color:var(--muted);font-size:1.1rem;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.center{text-align:center;justify-content:center}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px;background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.2rem;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer}
.brand .ten{background:var(--sun);color:#1b1503;border-radius:8px;padding:0 7px;font-size:1rem;line-height:1.6}
.who{font-weight:700}
.timer{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:99px;background:var(--sun-soft);min-width:72px;text-align:center}
.timer.done{background:var(--good-soft);color:var(--good)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:12px 20px;min-height:50px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-ink);box-shadow:0 3px 0 var(--primary-deep);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--primary-deep)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.good{background:var(--good);color:#fff;box-shadow:none}
.btn.bad{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{min-height:40px;padding:7px 13px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 6px;font-weight:700}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--primary-soft);color:var(--primary)}
.note{background:var(--sun-soft);border-radius:12px;padding:12px 14px;font-size:.95rem}

/* login */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:22px}
.name{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:64px;cursor:pointer;touch-action:manipulation}
.name:active{border-color:var(--primary)}
.ini{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.name b{display:block;line-height:1.2;overflow-wrap:anywhere}
.name small{color:var(--muted);font-size:.8rem}
.foot{margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* home */
.hello{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.meter{display:flex;height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 10px}
.meter span{display:block;height:100%}
.seg-good{background:var(--good)} .seg-near{background:var(--sun)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:20px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:158px;cursor:pointer;touch-action:manipulation}
.tile:active{border-color:var(--primary);transform:scale(.98)}
.tile[disabled]{opacity:.45;cursor:default}
.ti-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--sun-soft);margin-bottom:4px}
.ti-ic svg{width:28px;height:28px}
.ti-name{font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.15}
.ti-desc{font-size:.88rem;color:var(--muted);line-height:1.3;flex:1}
.tag{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--muted)}
.tag.write{background:var(--primary-soft);color:var(--primary)}
@media (hover:hover){.name:hover,.tile:not([disabled]):hover{border-color:var(--primary)}.tile:not([disabled]):hover{transform:translateY(-2px)}}

/* game */
.g-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.g-head h2{flex:1;min-width:0}
.g-count{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:flex;gap:5px;justify-content:center;margin:-6px 0 18px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--primary)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-bottom:20px}
.pic{font-size:3.4rem;line-height:1.1}
.de{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.1;overflow-wrap:anywhere}
.en{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,6vw,2.6rem);color:var(--primary);line-height:1.1;overflow-wrap:anywhere}
.flip{max-width:520px;margin:0 auto 18px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px;cursor:pointer;box-shadow:0 8px 0 -2px var(--line)}
.flip.open{animation:pop .25s ease-out}
.hint{color:var(--muted);font-size:.95rem}
.say{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border:0;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer}
.say svg{width:20px;height:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.opt{min-height:64px;font-size:1.25rem;font-family:var(--f-display);font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;overflow-wrap:anywhere;touch-action:manipulation}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
@media (max-width:360px){.opts{grid-template-columns:1fr}}
.answer{display:flex;gap:10px;max-width:560px;margin:0 auto;flex-wrap:wrap}
.type-in{flex:1 1 220px;min-width:0;font:700 1.6rem/1.2 var(--f-body);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.type-in:focus{outline:none;border-color:var(--primary)}
.type-in.ok{border-color:var(--good);background:var(--good-soft)}
.fb{min-height:64px;text-align:center;margin:16px auto 0;max-width:560px;font-weight:700;font-size:1.1rem}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.fb .sol{display:block;font-family:var(--f-display);font-size:1.8rem;color:var(--ink);margin-top:2px;letter-spacing:.02em}
.big-say{display:inline-flex;align-items:center;gap:10px;font-size:1.3rem;padding:18px 28px;min-height:72px;border-radius:99px}
.big-say svg{width:30px;height:30px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 24px}
.slot{width:40px;height:52px;border-bottom:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.7rem}
.slot.space{width:16px;border:0}
.slot.filled{border-color:var(--primary)}
.slot.next{border-color:var(--sun)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:600px;margin:0 auto}
.lt{width:56px;height:56px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-display);font-weight:800;font-size:1.6rem;cursor:pointer;touch-action:manipulation}
.lt.used{visibility:hidden}
.codegrid{display:grid;grid-template-columns:repeat(3,88px);gap:12px;justify-content:center;margin:0 auto}
.cbtn{width:88px;height:88px;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:2.6rem;cursor:pointer;touch-action:manipulation}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#cs .slot{width:64px;height:64px;font-size:2.2rem}
.sync{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.sync.off{color:var(--warn)} .sync.ok{color:var(--good)}
.codecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.codecard{border:2px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.codecard b{overflow-wrap:anywhere}
.codecard span{font-size:2.2rem;letter-spacing:6px}
@media print{body{background:#fff}.bar,.hello,.note,.tabs,.no-print{display:none!important}.printable{border:0;padding:0}.codecards{grid-template-columns:repeat(4,1fr)}.codecard{break-inside:avoid;color:#000;border-color:#999}}
.lt.glow{border-color:var(--sun);background:var(--sun-soft)}
.shake{animation:shake .35s}

/* torchlight */
.torch-task{text-align:center;font-size:1.2rem;margin-bottom:12px}
.torch-task b{font-family:var(--f-display);font-size:1.7rem}
.torch{position:relative;height:clamp(330px,58vh,520px);border-radius:20px;overflow:hidden;background:var(--torch-bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.t-word{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));background:none;border:0;color:var(--torch-word);font-family:var(--f-display);font-weight:800;font-size:clamp(1.05rem,3.4vw,1.5rem);white-space:nowrap;padding:12px;z-index:1;cursor:pointer}
.t-word.found{z-index:3;color:var(--torch-found);text-shadow:0 0 18px rgba(255,201,60,.7)}
.t-word.nope{color:#FF8A73}
.t-dark{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,226,140,.20) 0,rgba(255,226,140,.07) 60px,rgba(4,8,11,.985) 112px)}

/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
@media (max-width:520px){.mem-grid{grid-template-columns:repeat(3,1fr)}}
.mem{aspect-ratio:3/4;max-width:100%;border-radius:14px;border:2px solid var(--primary-deep);background:var(--primary);background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.08) 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.15;overflow-wrap:anywhere;text-align:center;touch-action:manipulation}
.mem.up{background:var(--card);border-color:var(--line);color:var(--ink);animation:pop .2s}
.mem.up.en-side{color:var(--primary)}
.mem.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.mem .mpic{font-size:1.9rem}

/* results / words */
.res-list{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:6px}
.res-list li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--paper)}
.res-list .mk{font-weight:800;width:18px}
.res-list .ok .mk{color:var(--good)} .res-list .no .mk{color:var(--bad)}
.res-list b{font-family:var(--f-display)}
.wlist{display:flex;flex-direction:column}
.unit-h{font-family:var(--f-display);font-weight:800;font-size:1.05rem;margin:18px 0 4px;color:var(--muted)}
.wrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow .wp{font-size:1.5rem;text-align:center}
.wrow .wt{min-width:0}
.wrow .wt b{display:block;overflow-wrap:anywhere}
.wrow .wt span{color:var(--primary);font-weight:700;overflow-wrap:anywhere}
.stars{letter-spacing:2px;font-size:1.1rem;color:var(--line)}
.stars .on{color:var(--sun)}
.stars .half{background:linear-gradient(90deg,var(--sun) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}

/* overlay */
#overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{max-width:460px;width:100%;text-align:center;animation:pop .3s ease-out}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:var(--paper);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}

/* teacher */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.tab{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;white-space:nowrap}
td{padding:11px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:active td,tr.sel td{background:var(--primary-soft)}
textarea,.field{width:100%;font:15px/1.5 var(--f-mono);padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.field{font:600 17px var(--f-body);max-width:260px}
label.lbl{font-weight:700;display:block;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:center;padding:6px 0;font-weight:700}
.check input{width:22px;height:22px}
.mini-bar{display:inline-block;width:80px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;vertical-align:middle;margin-right:8px}
.mini-bar i{display:block;height:100%;background:var(--good)}

@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="shell">
  <header class="bar" id="bar"></header>
  <main id="app"></main>
</div>
<div id="overlay" hidden></div>

<script>
/* ============================================================
   HIER DIE ADRESSE DEINES GOOGLE-SKRIPTS EINFÜGEN (endet auf /exec)
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbwJOk26FUmELTYpO9ih1RdIWlcYNg4EqD97PV7Z0AL_eLy8tR0sIdfR8XmsVMQ7mwWsKA/exec";

/* ============================================================
   KLASSEN-EINSTELLUNGEN  (Claude ersetzt diese Liste, wenn neue Vokabeln kommen)
   Format pro Wort: [Deutsch, Englisch (Alternativen mit /), Bild-Emoji optional]
   ============================================================ */
const DEFAULT_CONFIG = {
  minutes: 10,
  sampleNames: false,
  sampleWords: true,
  inactive: [],
  students: [],   /* Namen stehen in der Google-Tabelle, Blatt "Namen" */
  units: [
    { title: "Unit 1 · In the classroom", words: [
      ["Lineal","ruler","📏"],["Bleistift","pencil","✏️"],["Radiergummi","rubber/eraser",""],
      ["Schultasche","schoolbag","🎒"],["Buch","book","📕"],["Heft","exercise book","📓"],
      ["Schere","scissors","✂️"],["Kleber","glue",""],["Tafel","board",""],
      ["Klassenzimmer","classroom","🏫"],["Lehrer / Lehrerin","teacher","🧑‍🏫"],["Spitzer","sharpener",""],
      ["Füllfeder","pen","🖋️"],["Tisch","desk",""]
    ]},
    { title: "Unit 2 · Pets and animals", words: [
      ["Hund","dog","🐶"],["Katze","cat","🐱"],["Pferd","horse","🐴"],["Maus","mouse","🐭"],
      ["Vogel","bird","🐦"],["Kaninchen","rabbit","🐰"],["Schildkröte","tortoise","🐢"],

/* ---------- Speicher: Google-Tabelle über Google Apps Script (Code.gs) ---------- */
const apiReady = /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
async function api(action, body){
  if (!apiReady) throw new Error("setup");
  let r, d = null;
  /* text/plain vermeidet eine CORS-Vorabfrage, die Google nicht beantwortet */
  try { r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({action}, body || {})), redirect:"follow", cache:"no-store"}); }
  catch(e){ throw new Error("offline"); }
  try { d = await r.json(); } catch(e){}
  if (!r.ok || !d || d.error) throw new Error((d && d.error) || ("http" + r.status));
  return d;
}
const memLocal = {};
const local = {
  get(k, d){ try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch(e){} return k in memLocal ? memLocal[k] : d; },
  set(k, v){ memLocal[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* Fortschritt: sofort lokal zwischengespeichert, dann an Google geschickt.
   Ohne WLAN bleibt er auf dem iPad liegen und wird beim nächsten Mal nachgeschickt. */
let pushT = null, saveVer = 0, flushing = false;
function saveP(){
  if (!cur || !stu) return;
  const pend = local.get("vz_pending", {});
  pend[cur] = {code: curCode, data: stu, v: ++saveVer + "-" + Date.now()};
  local.set("vz_pending", pend);
  setSync("wait");
  /* höchstens alle 6 Sekunden an Google schicken, damit 17 Kinder gleichzeitig kein Limit erreichen */
  if (!pushT) pushT = setTimeout(flush, 6000);
}
async function flush(){
  clearTimeout(pushT); pushT = null;
  if (flushing){ pushT = setTimeout(flush, 1500); return; }
  flushing = true;
  let failed = false;
  for (const [name, p] of Object.entries(local.get("vz_pending", {}))){
    try {
      await api("save", {name, code: p.code, data: p.data});
      const now = local.get("vz_pending", {});
      if (now[name] && now[name].v === p.v){ delete now[name]; local.set("vz_pending", now); }
    } catch(e){
      if (e.message === "setup") break;
      if (e.message === "code" || e.message === "name"){ const now = local.get("vz_pending", {}); delete now[name]; local.set("vz_pending", now); }
      else failed = true;
    }
  }
  flushing = false;
  setSync(failed ? "off" : "ok");
  if (failed){ clearTimeout(pushT); pushT = setTimeout(flush, 15000); }
}
function setSync(state){
  const el = document.getElementById("sync"); if (!el) return;
  el.className = "sync " + state;
  el.textContent = state === "ok" ? "✓ gespeichert" : state === "wait" ? "speichert …" : "⚠ offline – wird nachgeholt";
}
function mergeStu(a, b){
  const t = {w: Object.assign({}, (a && a.w) || {}), sessions: ((a && a.sessions) || []).slice()};
  for (const [k, s] of Object.entries((b && b.w) || {})){ if (!t.w[k] || (s.t||0) >= (t.w[k].t||0)) t.w[k] = s; }
  for (const se of ((b && b.sessions) || [])){ if (!t.sessions.some(x => x.s === se.s)) t.sessions.push(se); }
  t.sessions.sort((x, y) => x.s - y.s);
  return t;
}

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"");
const DAY = 864e5;
/* Englisch 1× pro Woche: gekonnte Wörter kommen nach 1, 2, 4 und 8 Wochen wieder (je 1 Tag Spielraum) */

function accept(input, en){
  const a = norm(input); if (!a) return false;
  const strip = x => x.replace(/^(to|a|an|the) /,"");
  return en.split("/").map(norm).filter(Boolean).some(v => v===a || strip(v)===a || strip(a)===v || strip(a)===strip(v));
}
function lev(a, b){
  a=norm(a); b=norm(b); const m=a.length, n=b.length; if (!m||!n) return Math.max(m,n);
  let prev = Array.from({length:n+1},(_,i)=>i);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
const nearMiss = (input, en) => en.split("/").some(v => lev(input, v) === 1);

function speak(text, slow){
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();

    u.lang = "en-GB";
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v=>/^en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang));
    if (v) u.voice = v;
    u.rate = slow ? 0.55 : 0.9;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ---------- Wörter & Lernstand ---------- */
function words(all){
  const seen = new Set(), out = [];
  for (const u of cfg.units){
    if (!all && cfg.inactive.includes(u.title)) continue;
    for (const [de, en, emoji] of u.words){
      const key = norm(String(en).split("/")[0]);
      if (!key || seen.has(key)) continue;
      seen.add(key); out.push({de, en, emoji: emoji||"", unit: u.title, key});
    }
  }
  return out;
}
function getStu(name){ return P[name] || (P[name] = {w:{}, sessions:[]}); }
const st = (stu, w) => (stu && stu.w[w.key]) || {l:0, d:0, r:0, f:0};
function stats(stu, list){
  const now = Date.now(); let mastered=0, near=0, back=0, due=0;
  for (const w of list){ const s = st(stu,w);
    if (s.l>=3){ mastered++; if (s.d<=now) due++; }
    else { if (s.l>=2) near++; if (s.back) back++; } }
  return {total:list.length, mastered, near, back, due, practice:list.length-mastered};
}

let cur = null, stu = null, sess = null, timerId = null;

/* Kern der Wiederholungslogik:
   - Üben: richtig geschrieben (Schreiben/Diktat) = +1 Stern, richtig erkannt (andere Spiele) = +½ Stern bis max. 2.
   - "Gekonnt" = 3 Sterne UND an mindestens 2 verschiedenen Tagen richtig geschrieben.
   - Gekonnte Wörter kommen nur nach 2 → 5 → 12 → 30 Tagen wieder dran.
   - Gekonntes Wort falsch geschrieben / vergessen → zurück in die Übungsliste. */
function record(w, ok, typed, soft){
  const s = stu.w[w.key] || (stu.w[w.key] = {l:0, d:0, r:0, f:0});
  const now = Date.now();
  sess.answers++; if (ok) sess.correct++;
  if (ok){
    s.r = (s.r||0)+1;
    if (typed){ s.dy = s.dy||[]; const t=todayStr(); if (!s.dy.includes(t)){ s.dy.push(t); if (s.dy.length>6) s.dy.shift(); } }
    if (s.l < 3){
      if (typed) s.l += 1; else if (s.l < 2) s.l = Math.min(2, s.l + 0.5);
      if (s.l >= 3){
        if ((s.dy||[]).length >= 2){ s.l = 3; s.d = now + INTERVAL[3]; s.back = false; sess.mastered.push(w); }
        else s.l = 2.5;
      }
    } else if (typed){ s.l = Math.min(6, Math.floor(s.l)+1); s.d = now + INTERVAL[s.l]; }
    else if (s.d <= now) s.d = now + DAY;
  } else {
    s.f = (s.f||0)+1;
    if (s.l >= 3){
      if (soft) s.d = now;
      else { s.l = 1; s.back = true; s.dy = []; sess.relapsed.push(w); }
    } else s.l = Math.max(0, Math.floor(s.l) - 1);
  }
  s.t = now;
  saveSession();
}
function saveSession(){
  const sec = Math.min(3600, Math.round((Date.now()-sess.start)/1000));
  let e = stu.sessions.find(x => x.s === sess.start);
  if (!e){ e = {s: sess.start}; stu.sessions.push(e); if (stu.sessions.length>200) stu.sessions.shift(); }
  e.sec = sec; e.a = sess.answers; e.c = sess.correct;
  saveP();
}
function isReview(w){ return st(stu,w).l >= 3; }

function pick(n){
  const list = words(); if (!list.length) return [];
  const now = Date.now();
  const practice = shuffle(list.filter(w => st(stu,w).l < 3))
    .sort((a,b) => (st(stu,b).back?1:0)-(st(stu,a).back?1:0) || Math.floor(st(stu,a).l)-Math.floor(st(stu,b).l));
  const due = shuffle(list.filter(w => st(stu,w).l >= 3 && st(stu,w).d <= now));
  const reviewN = practice.length ? Math.min(due.length, Math.max(1, Math.round(n*0.25))) : n;
  const out = due.slice(0, reviewN);
  for (const w of practice){ if (out.length >= n) break; out.push(w); }
  if (out.length < n){
    const rest = list.filter(w => !out.includes(w)).sort((a,b)=>st(stu,a).d - st(stu,b).d);
    for (const w of rest){ if (out.length >= n) break; out.push(w); }
  }
  return shuffle(out);
}

        <span class="tag ${g.kind==="schreiben"?"write":""}">${g.kind}</span></button>`; }).join("")}</div>`;
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => GAMES.find(g=>g.id===b.dataset.g).fn());

/* ---------- Meine Wörter ---------- */
function starHTML(l){ const v = Math.min(3, Math.floor(l*2)/2); return `<span class="stars" aria-label="${String(v).replace(".",",")} von 3 Sternen">${[0,1,2].map(i=>`<span class="${v>=i+1?"on":v>=i+0.5?"half":""}">★</span>`).join("")}</span>`; }
function statusHTML(s){
  if (s.l >= 3) return `<span class="chip good">gekonnt</span>`;
  if (s.back) return `<span class="chip warn">wieder üben</span>`;
  return starHTML(s.l);
}
function wordRows(who, filter){
  const list = words(); let h = "", unit = null, count = 0;
  for (const w of list){
    const s = st(who, w);
    if (filter==="practice" && s.l>=3) continue;
    if (filter==="mastered" && s.l<3) continue;
    if (w.unit !== unit){ unit = w.unit; h += `<p class="unit-h">${esc(unit)}</p>`; }
    count++;
    h += `<div class="wrow"><span class="wp">${esc(w.emoji)}</span><span class="wt"><b>${esc(w.de)}</b><span>${esc(showEn(w))}</span></span>${statusHTML(s)}</div>`;
  }
  return count ? h : `<p class="muted" style="padding:18px 0">${filter==="mastered"?"Noch keine Wörter gekonnt – das kommt!":"Hier ist gerade nichts."}</p>`;
}
function showWords(filter){
  renderBar("student");
  const s = stats(stu, words());
  app.innerHTML = `
    <div class="g-head"><button class="btn ghost sm" id="back">← Spiele</button><h2>Meine Wörter</h2></div>
    <div class="row" style="margin-bottom:8px"><div class="seg" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="${filter==="all"}">Alle ${s.total}</button>
      <button data-f="practice" aria-pressed="${filter==="practice"}">Noch üben ${s.practice}</button>
      <button data-f="mastered" aria-pressed="${filter==="mastered"}">Gekonnt ${s.mastered}</button></div></div>
    <p class="muted small">★ = einmal richtig geschrieben (Schreiben, Diktat) · ½ ★ = richtig erkannt in den anderen Spielen.</p>
    <div class="card wlist" style="margin-top:12px">${wordRows(stu, filter)}</div>`;
  $("#back").onclick = showHome;
  app.querySelectorAll(".seg button").forEach(b => b.onclick = () => showWords(b.dataset.f));
  window.scrollTo(0,0);
}

/* ---------- Spiel-Rahmen ---------- */
let gtok = 0;
function stopGame(){ gtok++; if (canSpeak) try{ speechSynthesis.cancel(); }catch(e){} }
function later(fn, ms){ const t = gtok; setTimeout(() => { if (t === gtok) fn(); }, ms); }
function shell(title){
  stopGame(); renderBar("student");
  app.innerHTML = `<div class="g-head"><button class="btn ghost sm" id="gback">← Spiele</button><h2>${title}</h2><span class="g-count" id="gcount"></span></div><div id="dots" class="dots"></div><div id="gb"></div>`;
  $("#gback").onclick = showHome;
  window.scrollTo(0,0);
  return $("#gb");
}
function dots(res, total){
  const el = $("#dots"); if (!el) return;
  el.innerHTML = Array.from({length: total}, (_, i) => `<i class="${i<res.length ? (res[i].ok?"ok":"no") : i===res.length ? "now" : ""}"></i>`).join("");
  $("#gcount").textContent = `${Math.min(res.length+1,total)} / ${total}`;
}
function promptHTML(w){
  return `<div class="prompt">${w.emoji?`<span class="pic" aria-hidden="true">${esc(w.emoji)}</span>`:""}<p class="de">${esc(w.de)}</p>${isReview(w)?`<span class="chip plain">Wiederholung</span>`:""}</div>`;
}
function noWords(){ const b = shell("Hoppla"); b.innerHTML = `<p class="note">Für dieses Spiel sind zu wenige Vokabeln eingetragen.</p>`; }
function finish(title, res, again, mastBefore){
  const ok = res.filter(r=>r.ok).length;
  const fresh = sess.mastered.slice(mastBefore);
  $("#dots").innerHTML = ""; $("#gcount").textContent = "";
  $("#gb").innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">
    <p class="eyebrow">${title} · Runde fertig</p><h2>${ok} von ${res.length} richtig</h2>
    ${fresh.length ? `<p class="note" style="margin-top:12px">⭐ Neu gekonnt: <b>${fresh.map(w=>esc(firstEn(w))).join(", ")}</b></p>` : ""}
    <ul class="res-list">${res.map(r => `<li class="${r.ok?"ok":"no"}"><span class="mk">${r.ok?"✓":"✗"}</span><b>${esc(showEn(r.w))}</b><span class="muted">${esc(r.w.de)}</span></li>`).join("")}</ul>
    <div class="row"><button class="btn" id="again">Nochmal</button><button class="btn ghost" id="other">Anderes Spiel</button></div></div>`;
  $("#again").onclick = again; $("#other").onclick = showHome;
}
const sayBtn = (id="sayEn") => canSpeak ? `<button class="say" id="${id}" type="button">${IC.speaker}Anhören</button>` : "";

/* 1 · Karteikarten */
function gFlash(){
  const list = pick(8); if (!list.length) return noWords();
  const b = shell("Karteikarten"), res = [], m0 = sess.mastered.length; let i = 0;
  const step = () => {
    if (i >= list.length) return finish("Karteikarten", res, gFlash, m0);
    const w = list[i]; dots(res, list.length);
    b.innerHTML = `<div class="flip" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">${promptHTML(w)}<p class="hint">Weißt du das englische Wort? Sag es leise – dann tippe auf die Karte.</p></div>
      <div class="row center" id="acts"><button class="btn" id="turn">Umdrehen</button></div>`;
    const reveal = () => {
      const c = $("#card"); if (c.classList.contains("open")) return;
      c.classList.add("open"); c.removeAttribute("role");
      c.innerHTML = `${w.emoji?`<span class="pic">${esc(w.emoji)}</span>`:""}<p class="muted">${esc(w.de)}</p><p class="en">${esc(showEn(w))}</p>${sayBtn()}`;
      speak(firstEn(w));
      if ($("#sayEn")) $("#sayEn").onclick = e => { e.stopPropagation(); speak(firstEn(w)); };
      $("#acts").innerHTML = `<button class="btn good" id="yes">✓ Gewusst</button><button class="btn bad" id="no">✗ Noch nicht</button>`;
      $("#yes").onclick = () => { record(w, true, false); res.push({w, ok:true}); i++; step(); };
      $("#no").onclick  = () => { record(w, false, false); res.push({w, ok:false}); i++; step(); };
    };
    $("#card").onclick = reveal; $("#turn").onclick = reveal;
    $("#card").onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); reveal(); } };
  };

}

/* 2 · Quiz */
function gQuiz(){
  const list = pick(8); if (!list.length) return noWords();
  const pool = words().length >= 4 ? words() : words(true);
  const b = shell("Quiz"), res = [], m0 = sess.mastered.length; let i = 0;
  const step = () => {
    if (i >= list.length) return finish("Quiz", res, gQuiz, m0);
    const w = list[i]; dots(res, list.length);
    const opts = shuffle([w, ...shuffle(pool.filter(x => x.key !== w.key)).slice(0, 3)]);
    b.innerHTML = `${promptHTML(w)}<div class="opts">${opts.map(o => `<button class="opt" data-k="${esc(o.key)}">${esc(firstEn(o))}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
    let done = false;
    b.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
      if (done) return; done = true;
      const ok = btn.dataset.k === w.key;
      b.querySelectorAll(".opt").forEach(o => { if (o.dataset.k === w.key) o.classList.add("right"); });
      if (!ok) btn.classList.add("wrong");
      record(w, ok, false); res.push({w, ok});
      speak(firstEn(w));
      $("#fb").className = "fb " + (ok ? "good" : "bad");
      $("#fb").textContent = ok ? "Richtig!" : `${w.de} heißt „${showEn(w)}“.`;
      later(() => { i++; step(); }, ok ? 900 : 2000);
    });
  };
  step();
}

/* 3 · Buchstabieren */
function gSpell(){
  const list = pick(6); if (!list.length) return noWords();
  const b = shell("Buchstabieren"), res = [], m0 = sess.mastered.length; let i = 0;
  const step = () => {
    if (i >= list.length) return finish("Buchstabieren", res, gSpell, m0);
    const w = list[i]; dots(res, list.length);
    const target = firstEn(w), chars = [...target];
    const need = chars.map((c, idx) => ({c, idx})).filter(x => x.c !== " ");
    let tiles = shuffle(need.map(x => x.c));
    if (tiles.join("") === need.map(x=>x.c).join("") && tiles.length > 1) tiles = tiles.reverse();
    let pos = 0, mistakes = 0, wrongHere = 0;
    b.innerHTML = `${promptHTML(w)}
      <div class="slots" id="slots">${chars.map(c => c===" " ? `<span class="slot space"></span>` : `<span class="slot"></span>`).join("")}</div>
      <div class="letters" id="letters">${tiles.map((c, k) => `<button class="lt" data-k="${k}" aria-label="Buchstabe ${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="row center" style="margin-top:16px"><button class="link" id="help">Tipp: nächster Buchstabe</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    const slots = [...b.querySelectorAll(".slot:not(.space)")];
    const mark = () => slots.forEach((s, k) => s.classList.toggle("next", k === pos));
    mark();
    const glow = () => { const want = need[pos].c.toLowerCase(); const t = [...b.querySelectorAll(".lt:not(.used)")].find(x => x.textContent.toLowerCase() === want); if (t) t.classList.add("glow"); };
    b.querySelectorAll(".lt").forEach(t => t.onclick = () => {
      if (pos >= need.length) return;
      if (t.textContent.toLowerCase() === need[pos].c.toLowerCase()){
        slots[pos].textContent = need[pos].c; slots[pos].classList.add("filled");
        t.classList.add("used"); b.querySelectorAll(".lt.glow").forEach(x=>x.classList.remove("glow"));
        pos++; wrongHere = 0; mark();
        if (pos >= need.length){
          const ok = mistakes === 0;
          record(w, ok, false); res.push({w, ok}); speak(target);
          $("#fb").className = "fb " + (ok ? "good" : "bad");
          $("#fb").textContent = ok ? "Perfekt buchstabiert!" : "Geschafft – beim nächsten Mal ohne Fehler!";
          later(() => { i++; step(); }, 1300);
        }
      } else {
        mistakes++; wrongHere++;
        t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
        if (wrongHere >= 2) glow();
      }
    });
    $("#help").onclick = () => { if (pos < need.length){ mistakes++; glow(); } };
  };
  step();
}

/* 4 · Schreiben & 5 · Diktat */
function gWrite(mode){
  const listen = mode === "listen";
  const list = pick(8); if (!list.length) return noWords();
  const title = listen ? "Diktat" : "Schreiben";
  const b = shell(title), res = [], m0 = sess.mastered.length; let i = 0;
  const step = (first) => {
    if (i >= list.length) return finish(title, res, () => gWrite(mode), m0);
    const w = list[i]; dots(res, list.length);
    const top = listen
      ? `<div class="prompt"><button class="btn big-say" id="say" type="button">${IC.speaker}Anhören</button>
           <div class="row center"><button class="link" id="slow" type="button">langsam</button><button class="link" id="hint" type="button">Deutsch zeigen</button></div>
           <p class="de" id="hintTxt" hidden>${w.emoji?esc(w.emoji)+" ":""}${esc(w.de)}</p>${isReview(w)?`<span class="chip plain">Wiederholung</span>`:""}</div>`
      : promptHTML(w);
    b.innerHTML = `${top}
      <form class="answer" id="f" autocomplete="off">
        <input id="ans" class="type-in" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" placeholder="auf Englisch …" aria-label="Englisches Wort">
        <button class="btn" id="go">Prüfen</button></form>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="row center"><button class="link" id="dunno" type="button">Weiß ich nicht</button></div>`;
    const ans = $("#ans"), fb = $("#fb");
    let phase = "answer";
    if (listen){
      $("#say").onclick = () => { speak(firstEn(w)); ans.focus(); };
      $("#slow").onclick = () => speak(firstEn(w), true);
      $("#hint").onclick = () => { $("#hintTxt").hidden = false; $("#hint").hidden = true; };
      if (first) speak(firstEn(w)); else later(() => speak(firstEn(w)), 350);
    }
    ans.focus();
    const wrong = (near) => {
      record(w, false, true); res.push({w, ok:false}); phase = "copy";
      fb.className = "fb bad";
      fb.innerHTML = `${near ? "Fast! Ein Buchstabe stimmt nicht." : "Leider nicht."} Richtig ist:<span class="sol">${esc(showEn(w))}</span><span class="muted small">Schreib es jetzt einmal richtig ab.</span>`;
      ans.value = ""; ans.focus(); speak(firstEn(w));
      $("#dunno").hidden = true;
    };
    $("#f").onsubmit = e => {
      e.preventDefault();
      const v = ans.value;
      if (!norm(v)) { ans.focus(); return; }
      if (phase === "answer"){
        if (accept(v, w.en)){
          const wasReview = isReview(w);
          record(w, true, true); res.push({w, ok:true}); phase = "done";
          ans.classList.add("ok"); ans.readOnly = true;
          fb.className = "fb good"; fb.textContent = wasReview ? "Richtig – sitzt noch!" : "Richtig!";
          speak(firstEn(w));
          later(() => { i++; step(); }, 1000);
        } else wrong(nearMiss(v, w.en));
      } else if (phase === "copy"){
        if (accept(v, w.en)){
          phase = "done"; ans.classList.add("ok"); ans.readOnly = true;
          fb.className = "fb good"; fb.textContent = "Gut abgeschrieben! Weiter geht’s.";
          later(() => { i++; step(); }, 800);
        } else { ans.classList.remove("shake"); void ans.offsetWidth; ans.classList.add("shake"); }
      }
    };
    $("#dunno").onclick = () => { if (phase === "answer") wrong(false); };
  };
  step(true);
}

/* 6 · Torchlight */
function gTorch(){
  const list = pick(6); if (list.length < 3) return noWords();
  const b = shell("Torchlight"), res = [], m0 = sess.mastered.length;
  const order = shuffle(list); let r = 0, mistake = false;
  const cells = shuffle(list.map((_, k) => k));
  b.innerHTML = `<p class="torch-task" id="task" aria-live="polite"></p>
    <div class="torch" id="board">
      ${list.map((w, k) => { const c = cells[k], col = c % 3, row = Math.floor(c / 3);
        const x = (col + 0.22 + Math.random()*0.56) / 3 * 100, y = (row + 0.25 + Math.random()*0.5) / 2 * 100, rot = (Math.random()*14-7).toFixed(1);
        return `<button class="t-word" data-k="${esc(w.key)}" style="left:${x}%;top:${y}%;--rot:${rot}deg">${esc(firstEn(w))}</button>`; }).join("")}
      <div class="t-dark" id="dark"></div></div>
    <p class="muted center small" style="margin-top:10px">Zieh den Finger über das Bild – die Taschenlampe zeigt die Wörter. Dann tippe auf das richtige.</p>`;
  const board = $("#board"), dark = $("#dark");
  const light = (cx, cy) => { const rc = board.getBoundingClientRect(); dark.style.setProperty("--x", (cx-rc.left)+"px"); dark.style.setProperty("--y", (cy-rc.top)+"px"); };
  board.addEventListener("pointermove", e => light(e.clientX, e.clientY));
  board.addEventListener("pointerdown", e => light(e.clientX, e.clientY));
  const task = () => { const w = order[r]; dots(res, order.length);
    $("#task").innerHTML = `Finde: ${w.emoji?esc(w.emoji)+" ":""}<b>${esc(w.de)}</b>`; };
  b.querySelectorAll(".t-word").forEach(btn => {
    btn.addEventListener("focus", () => { const rc = btn.getBoundingClientRect(); light(rc.left+rc.width/2, rc.top+rc.height/2); });
    btn.onclick = () => {
      if (r >= order.length || btn.classList.contains("found")) return;
      const w = order[r];
      if (btn.dataset.k === w.key){
        btn.classList.add("found"); speak(firstEn(w));
        record(w, !mistake, false, true); res.push({w, ok:!mistake});
        r++; mistake = false;
        if (r >= order.length) later(() => finish("Torchlight", res, gTorch, m0), 1100); else task();
      } else {
        mistake = true; btn.classList.add("nope"); setTimeout(() => btn.classList.remove("nope"), 600);
      }
    };
  });
  task();
}

/* 7 · Memory */
function gMemory(){
  const list = pick(6); if (list.length < 3) return noWords();
  const b = shell("Memory"), res = [], m0 = sess.mastered.length;
  const cards = shuffle(list.flatMap(w => [{w, side:"de"}, {w, side:"en"}]));
  let open = [], lock = false, moves = 0, found = 0;
  b.innerHTML = `<p class="center muted" style="margin-bottom:14px">Finde zu jedem deutschen Wort das englische.</p>
    <div class="mem-grid">${cards.map((c, k) => `<button class="mem" data-i="${k}" aria-label="Karte ${k+1}"></button>`).join("")}</div>`;
  $("#dots").innerHTML = ""; const cnt = () => $("#gcount").textContent = `Züge: ${moves}`; cnt();
  const face = c => c.side === "de" ? `${c.w.emoji?`<span class="mpic">${esc(c.w.emoji)}</span>`:""}<span>${esc(c.w.de)}</span>` : `<span>${esc(firstEn(c.w))}</span>`;
  b.querySelectorAll(".mem").forEach(el => el.onclick = () => {
    const c = cards[+el.dataset.i];
    if (lock || el.classList.contains("up") || el.classList.contains("done")) return;
    el.classList.add("up"); if (c.side === "en") el.classList.add("en-side"); el.innerHTML = face(c);
    if (c.side === "en") speak(firstEn(c.w));
    open.push(el);
    if (open.length === 2){
      moves++; cnt();
      const [a, z] = open.map(o => cards[+o.dataset.i]);
      if (a.w.key === z.w.key){
        open.forEach(o => { o.classList.add("done"); o.setAttribute("aria-label", "gefunden"); });
        record(a.w, true, false); res.push({w:a.w, ok:true}); found++; open = [];
        if (found === list.length) later(() => finish("Memory", res, gMemory, m0), 900);
      } else {
        lock = true;
        later(() => { open.forEach(o => { o.classList.remove("up","en-side"); o.innerHTML = ""; }); open = []; lock = false; }, 1100);
      }
    }
  });
}

async function teacherLoad(pin){

const fmtDay = t => new Date(t).toLocaleDateString("de-AT", {weekday:"short", day:"2-digit", month:"2-digit"});
function serialize(units){ return units.map(u => `# ${u.title}\n` + u.words.map(w => `${w[0]} = ${w[1]}${w[2] ? " = "+w[2] : ""}`).join("\n")).join("\n\n"); }
function parseVocab(text){
  const units = []; let u = null;
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if (!line) continue;
    if (line.startsWith("#")){ u = {title: line.replace(/^#+\s*/, "") || "Unit", words: []}; units.push(u); continue; }
    const p = line.split(/\s*(?:=|\t|;)\s*/);
    if (p.length < 2 || !p[0] || !p[1]) continue;
    if (!u){ u = {title: "Vokabeln", words: []}; units.push(u); }
    u.words.push([p[0], p[1], p[2] || ""]);
  }
  return units.filter(x => x.words.length);
}
function showTeacher(tab, sel){

    ${pinDefault ? `<p class="note"><b>Bitte ändere die Start-PIN 1234</b> unter „Einstellungen“.</p>` : ""}
    <div class="tabs" role="tablist">${T.map(([id, l]) => `<button class="tab" role="tab" data-t="${id}" aria-selected="${tab===id}">${l}</button>`).join("")}</div>
    <div id="tb"></div>`;
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => showTeacher(b.dataset.t));
  const tb = $("#tb"), list = words();

  if (tab === "klasse"){
    const rows = cfg.students.map(n => { const p = P[n], s = stats(p, list);
      const ses = (p && p.sessions) || []; const last = ses.length ? ses[ses.length-1].s : 0;
      const min = Math.round(ses.reduce((a, x) => a + (x.sec||0), 0) / 60);
      return {n, s, last, min}; });
    const hard = list.map(w => { let f = 0, prac = 0; for (const n of cfg.students){ const s = st(P[n], w); f += s.f||0; if (P[n] && s.l < 3 && (s.r||s.f)) prac++; } return {w, f, prac}; })
      .filter(x => x.f > 0).sort((a, b) => b.f - a.f).slice(0, 6);
    tb.innerHTML = `<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Name</th><th>Gekonnt</th><th>Noch üben</th><th>Wieder dabei</th><th>Zuletzt</th><th>Minuten</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="click ${sel===r.n?"sel":""}" data-n="${esc(r.n)}"><td><b>${esc(r.n)}</b></td>
        <td><span class="mini-bar"><i style="width:${r.s.total ? r.s.mastered/r.s.total*100 : 0}%"></i></span>${r.s.mastered}/${r.s.total}</td>
        <td>${r.s.practice}</td><td>${r.s.back ? `<span class="chip warn">${r.s.back}</span>` : "–"}</td>
        <td>${r.last ? fmtDay(r.last) : "noch nie"}</td><td>${r.min}</td></tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:10px"><p class="muted small">Tippe auf einen Namen für die Wortliste.</p><span class="spacer"></span><button class="btn ghost sm" id="reload">Aktualisieren</button></div></div>
      <div id="detail"></div>
      <div class="card" style="margin-top:16px"><h3>Schwierigste Wörter der Klasse</h3>
        ${hard.length ? `<div class="wlist">${hard.map(h => `<div class="wrow"><span class="wp">${esc(h.w.emoji)}</span><span class="wt"><b>${esc(h.w.de)}</b><span>${esc(showEn(h.w))}</span></span><span class="muted small">${h.f}× falsch</span></div>`).join("")}</div>`
          : `<p class="muted" style="margin-top:8px">Noch keine Fehler gesammelt.</p>`}</div>`;
    tb.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => showTeacher("klasse", tr.dataset.n));
    $("#reload").onclick = () => teacherLoad(teacherPin).then(() => showTeacher("klasse", sel)).catch(e => { $("#reload").textContent = errText(e); });
    if (sel){
      $("#detail").innerHTML = `<div class="card" style="margin-top:16px"><div class="row"><h3>${esc(sel)}</h3><span class="spacer"></span>
        <button class="btn ghost sm" id="rst">Fortschritt löschen</button></div><div class="wlist">${wordRows(P[sel], "all")}</div></div>`;
      $("#rst").onclick = () => { const b = $("#rst");
        if (b.dataset.sure){ api("reset", {pin: teacherPin, name: sel}).then(() => { delete P[sel]; showTeacher("klasse"); }).catch(e => { b.textContent = errText(e); }); }
        else { b.dataset.sure = 1; b.textContent = "Wirklich löschen?"; b.className = "btn bad sm"; } };
      $("#detail").scrollIntoView({behavior:"smooth", block:"start"});
    }
  }

  if (tab === "codes"){
    tb.innerHTML = `<div class="card printable"><div class="row no-print" style="margin-bottom:10px"><p class="muted small" style="flex:1 1 260px">Jedes Kind tippt nach dem Namen seine zwei Zeichen in dieser Reihenfolge. So kann niemand den Stand eines anderen Kindes öffnen.</p>
      <button class="btn ghost sm" id="prt">Liste drucken</button></div>
      <div class="codecards">${cfg.students.map(n => { const c = codes[n]; return `<div class="codecard"><b>${esc(n)}</b><span>${c ? SYMBOLS[c[0]] + " " + SYMBOLS[c[1]] : "–"}</span></div>`; }).join("")}</div></div>`;
    $("#prt").onclick = () => window.print();
  }

  if (tab === "vokabeln"){
    tb.innerHTML = `<div class="card stack">
      <div><label class="lbl" for="vtext">Vokabelliste</label>
      <p class="muted small" style="margin-bottom:8px">Eine Zeile pro Wort: <code>Deutsch = Englisch = Emoji</code>. Das Emoji ist freiwillig. Mehrere richtige Antworten mit / trennen (<code>rubber/eraser</code>). Neue Unit mit <code># Titel</code>.</p>
      <textarea id="vtext" rows="16" spellcheck="false" autocapitalize="none" autocorrect="off">${esc(serialize(cfg.units))}</textarea></div>
      <p id="vinfo" class="muted small"></p>
      <div class="row"><button class="btn" id="vsave">Speichern</button><button class="btn ghost" id="vreset">Original wiederherstellen</button></div>
      <p class="muted small">Die Vokabeln stehen auch in deiner Google-Tabelle im Blatt „Vokabeln“ und lassen sich dort bearbeiten. Gespeicherte Vokabeln gelten sofort auf allen iPads. Der Lernstand eines Wortes bleibt erhalten, solange das (erste) englische Wort gleich bleibt.</p></div>
      <div class="card" style="margin-top:16px"><h3>Welche Units wird geübt?</h3>
      ${cfg.units.map((u, k) => `<label class="check"><input type="checkbox" id="u${k}" data-u="${esc(u.title)}" ${cfg.inactive.includes(u.title) ? "" : "checked"}> ${esc(u.title)} <span class="muted small">(${u.words.length} Wörter)</span></label>`).join("")}
      <p class="muted small" style="margin-top:6px">Gekonnte Wörter bleiben gespeichert, auch wenn eine Unit pausiert ist.</p></div>`;
    const info = () => { const u = parseVocab($("#vtext").value); $("#vinfo").textContent = `${u.reduce((a,x)=>a+x.words.length,0)} Wörter in ${u.length} ${u.length===1?"Unit":"Units"} erkannt.`; };
    $("#vtext").oninput = info; info();
    $("#vsave").onclick = () => { const u = parseVocab($("#vtext").value); if (!u.length){ $("#vinfo").textContent = "Keine Wörter erkannt – bitte das Format prüfen."; return; }
      saveCfg({units: u, sampleWords: false}).then(() => { showTeacher("vokabeln"); $("#vinfo").textContent = "Gespeichert – gilt jetzt auf allen iPads."; }).catch(e => { $("#vinfo").textContent = errText(e); }); };
    $("#vreset").onclick = () => { const b = $("#vreset");
      if (b.dataset.sure){ saveCfg({units: null, sampleWords: null, inactive: null}).then(() => showTeacher("vokabeln")).catch(e => { $("#vinfo").textContent = errText(e); }); }
      else { b.dataset.sure = 1; b.textContent = "Wirklich? Eigene Liste geht verloren"; } };
    tb.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = () => {
      const inactive = [...tb.querySelectorAll("input[type=checkbox]")].filter(x => !x.checked).map(x => x.dataset.u);
      saveCfg({inactive}).catch(e => alertInline(tb, errText(e))); });
  }

  if (tab === "namen"){
    tb.innerHTML = `<div class="card stack"><div><label class="lbl" for="ntext">Namen der Klasse (einer pro Zeile)</label>
      <textarea id="ntext" rows="18" spellcheck="false">${esc(cfg.students.join("\n"))}</textarea></div>
      <p class="muted small">Du kannst die Namen auch direkt in deiner Google-Tabelle im Blatt „Namen“ ändern. Der Fortschritt hängt am Namen: Wenn du einen Namen änderst, beginnt das Kind neu und bekommt neue Geheimzeichen.</p>
      <div class="row"><button class="btn" id="nsave">Speichern</button><span id="ninfo" class="muted"></span></div></div>`;
    $("#nsave").onclick = () => { const names = [...new Set($("#ntext").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean))];
      if (!names.length) return;
      saveCfg({students: names, sampleNames: false}).then(() => teacherLoad(teacherPin)).then(() => { $("#ninfo").textContent = `${names.length} Namen gespeichert.`; }).catch(e => { $("#ninfo").textContent = errText(e); }); };
  }

  if (tab === "einst"){
    tb.innerHTML = `<form class="card stack" id="sf">
      <div><label class="lbl" for="smin">Übungszeit in Minuten</label><input class="field" id="smin" type="number" min="3" max="30" value="${cfg.minutes}"></div>
      <div><label class="lbl" for="spin">Neue PIN für den Lehrerbereich</label><input class="field" id="spin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="leer = bleibt gleich"></div>
      <div class="row"><button class="btn">Speichern</button><span id="sinfo" class="muted"></span></div>
      <p class="muted small">Mindestens 4 Zeichen. Die PIN wird verschlüsselt in deiner Google-Tabelle gespeichert.</p></form>`;
    $("#sf").onsubmit = e => { e.preventDefault(); const m = Math.max(3, Math.min(30, parseInt($("#smin").value, 10) || 10));
      const p = $("#spin").value.trim();
      if (p && p.length < 4){ $("#sinfo").textContent = "Die PIN braucht mindestens 4 Zeichen."; return; }
      const patch = {minutes: m}; if (p) patch.newPin = p;
      saveCfg(patch).then(() => { $("#sinfo").textContent = p ? "Gespeichert. Neue PIN ist aktiv." : "Gespeichert."; $("#spin").value = ""; }).catch(e => { $("#sinfo").textContent = errText(e); }); };
  }

  if (tab === "sichern"){
    const data = JSON.stringify({app: "vokabel-zehner", v: 1, exported: new Date().toISOString(), progress: P});
    tb.innerHTML = `<div class="card stack"><h3>1 · Sicherung aller Spielstände</h3>
      <p class="muted small">Alle Stände liegen in deiner Google-Tabelle. Wenn du zusätzlich eine Sicherung willst, kopiere diesen Text und leg ihn z. B. in einer Notiz ab.</p>
      <textarea id="exp" rows="5" readonly>${esc(data)}</textarea>
      <div class="row"><button class="btn" id="copy">Kopieren</button><span id="cinfo" class="muted"></span></div></div>
      <div class="card stack" style="margin-top:16px"><h3>2 · Sicherung oder alten Stand einspielen</h3>
      <p class="muted small">Füge eine Sicherung ein, auch einen kopierten Stand aus der früheren Claude-Version. Für jedes Wort wird der neuere Stand behalten.</p>
      <textarea id="imp" rows="5" placeholder="Hier einfügen …"></textarea>
      <div class="row"><button class="btn" id="merge">Zusammenführen</button><label class="btn ghost" for="impFile" style="cursor:pointer">Datei wählen</label>
      <input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden><span id="minfo" class="muted"></span></div></div>`;
    $("#copy").onclick = () => { const ta = $("#exp");
      const fallback = () => { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); $("#cinfo").textContent = "Text ist markiert – jetzt „Kopieren“ wählen."; };
      try { navigator.clipboard.writeText(ta.value).then(() => $("#cinfo").textContent = "Kopiert.", fallback); } catch(e){ fallback(); } };
    const doMerge = txt => { let d; try { d = JSON.parse(txt); } catch(e){ $("#minfo").textContent = "Das ist kein gültiger Sicherungstext."; return; }
      api("import", {pin: teacherPin, progress: d.progress || d}).then(r => { P = r.progress || P; $("#minfo").textContent = `${r.count} Kinder zusammengeführt.`; }).catch(e => { $("#minfo").textContent = errText(e); }); };
    $("#merge").onclick = () => doMerge($("#imp").value);
    $("#impFile").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doMerge(r.result); r.readAsText(f); };
  }
  window.scrollTo(0,0);
}

function alertInline(where, msg){ const p = document.createElement("p"); p.className = "note"; p.textContent = msg; where.prepend(p); }

/* ---------- Start ---------- */
(async () => {
  app.innerHTML = `<p class="muted" style="padding:40px 0">Lädt …</p>`;
  await loadConfig();
  showLogin();
  flush();
  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
})();
</script>

</body>
</html>
