<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#D8F6EA">
<link rel="preload" href="fonts/fredoka.woff" as="font" type="font/woff" crossorigin>
<title>Vokabel-Zehner</title>
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
@font-face{font-family:"Fredoka";src:url("fonts/fredoka.woff") format("woff");font-weight:400 700;font-display:swap}
/* Layout: one centred column (max 880px) standing on a cartoon classroom desk — mint wall, peach desktop,
   chunky navy outlines, cream cards with a hard drop shadow, kawaii decor on wide screens. Single light look by design. */
:root{
  color-scheme:light;
  --wall:#D8F6EA; --wall-2:#C4EFE0; --desk:#F8D7A4; --desk-edge:#EFC184;
  --ink:#1B2445; --muted:#4B5574; --cream:#FFF9EC; --card:#FFFDF6; --line:#E8DDC6;
  --mint:#8FE5C9; --mint-deep:#47B38F; --grape:#A487F0; --grape-deep:#6C4FCB;
  --sun:#FFCD45; --sun-soft:#FFF0C4; --sky:#D5EBFF; --blush:#F7A5B6; --coral:#F59A6C;
  --primary:#1B2445; --primary-soft:#E2F7EF;
  --good:#23885A; --good-soft:#D5F4E3; --bad:#D4472F; --bad-soft:#FDE0D8; --warn:#A8620A; --warn-soft:#FFEDC8;
  --scrim:rgba(27,36,69,.55);
  --torch-bg:#151B33; --torch-word:#FFF0C4; --torch-found:#FFCD45;
  --f-display:"Fredoka",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Fredoka",ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ol:3px solid var(--ink);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--wall);color:var(--ink);font:500 17px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wall)}

/* scene */
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--wall)}
.scene .desk{position:absolute;left:0;right:0;bottom:0;height:24%;background:var(--desk);border-top:4px solid var(--desk-edge)}
.scene .deco{position:absolute;bottom:calc(24% - 18px);width:150px;display:none}
.scene .deco.l{left:max(10px,env(safe-area-inset-left,0px))}
.scene .deco.r{right:max(10px,env(safe-area-inset-right,0px))}
@media (min-width:1100px){.scene .deco{display:block}}

.shell{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.005em;color:var(--ink)}
h1{font-size:clamp(2.2rem,6vw,3.3rem);line-height:1.02;font-weight:700}
h2{font-size:1.6rem;font-weight:700;line-height:1.15}
h3{font-size:1.28rem;font-weight:700}
p{margin:0}
.eyebrow{display:inline-block;align-self:flex-start;font-size:.82rem;letter-spacing:.04em;font-weight:600;color:var(--ink);background:var(--sky);border:2px solid var(--ink);border-radius:99px;padding:2px 12px;margin-bottom:8px}
.lead{color:var(--muted);font-size:1.15rem;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:.92rem}
.center{text-align:center;justify-content:center}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sun-soft);padding:1px 5px;border-radius:6px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px;background:var(--wall);margin-bottom:22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer}
.brand .ten{background:var(--sun);color:var(--ink);border:var(--ol);border-radius:10px;padding:0 8px;font-size:1rem;line-height:1.5;transform:rotate(-4deg);box-shadow:0 3px 0 var(--ink)}
.who{font-weight:600}
.timer{font-family:var(--f-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;padding:4px 14px;border-radius:14px;background:var(--cream);border:var(--ol);box-shadow:0 3px 0 var(--ink);min-width:84px;text-align:center}
.timer.done{background:var(--good-soft);color:var(--good)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:1.05rem;padding:11px 22px;min-height:52px;border-radius:18px;border:var(--ol);background:var(--mint);color:var(--ink);box-shadow:0 5px 0 var(--mint-deep);cursor:pointer;touch-action:manipulation;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mint-deep)}
.btn.ghost{background:var(--cream);box-shadow:0 5px 0 var(--ink)}
.btn.ghost:active{box-shadow:0 1px 0 var(--ink)}
.btn.good{background:#7EDDA9;box-shadow:0 5px 0 #3A9A66}
.btn.bad{background:#FFB1A1;box-shadow:0 5px 0 #D06A55}
.btn.sm{min-height:42px;padding:6px 14px;font-size:.95rem;border-radius:14px;box-shadow:0 4px 0 var(--mint-deep)}
.btn.ghost.sm{box-shadow:0 4px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;padding:10px 6px;font-weight:600}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.card{background:var(--card);border:var(--ol);border-radius:24px;padding:20px;box-shadow:0 6px 0 rgba(27,36,69,.16)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600;white-space:nowrap;border:2px solid currentColor}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--sky);color:var(--ink)}
.note{background:var(--sun-soft);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:1rem}

/* mascot */
.hello.hero{display:flex;flex-direction:row;align-items:center;gap:18px}
.hero .txt{display:flex;flex-direction:column;min-width:0}
.mascot{flex:none;width:clamp(84px,16vw,120px);height:auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}

/* login */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-top:22px}
.name{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:var(--ol);border-radius:18px;padding:12px;min-height:68px;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.name:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ini{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:var(--ol);background:var(--sun);font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.name:nth-child(5n+2) .ini{background:var(--mint)} .name:nth-child(5n+3) .ini{background:var(--grape);color:#fff} .name:nth-child(5n+4) .ini{background:var(--blush)} .name:nth-child(5n+5) .ini{background:var(--sky)}
.name b{display:block;line-height:1.2;overflow-wrap:anywhere;font-weight:600}
.name small{color:var(--muted);font-size:.8rem}
.foot{margin-top:30px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* home */
.hello{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
.meter{display:flex;height:22px;border-radius:99px;background:var(--cream);border:var(--ol);overflow:hidden;margin:12px 0 10px}
.meter span{display:block;height:100%}
.seg-good{background:var(--good)} .seg-near{background:var(--sun)}
.meter .seg-good{background:#5FD39A} .meter .seg-near{background:var(--sun)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.95rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:2px solid var(--ink)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:22px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:var(--ol);border-radius:22px;padding:16px;min-height:170px;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.tile[disabled]{opacity:.5;cursor:default;transform:none}
.ti-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--sun);border:var(--ol);margin-bottom:4px}
.tile:nth-child(7n+2) .ti-ic{background:var(--mint)} .tile:nth-child(7n+3) .ti-ic{background:var(--sky)} .tile:nth-child(7n+4) .ti-ic{background:var(--grape);color:#fff}
.tile:nth-child(7n+5) .ti-ic{background:var(--blush)} .tile:nth-child(7n+6) .ti-ic{background:var(--coral)} .tile:nth-child(7n+7) .ti-ic{background:#B8E986}
.ti-ic svg{width:28px;height:28px}
.ti-name{font-family:var(--f-display);font-weight:700;font-size:1.22rem;line-height:1.15}
.ti-desc{font-size:.92rem;color:var(--muted);line-height:1.3;flex:1}
.tag{font-size:.76rem;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--cream);border:2px solid var(--ink);color:var(--ink)}
.tag.write{background:var(--sun-soft)}
@media (hover:hover){.name:hover,.tile:not([disabled]):hover{transform:translateY(-3px)}}

/* game */
.g-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.g-head h2{flex:1;min-width:0}
.g-count{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;background:var(--cream);border:var(--ol);border-radius:12px;padding:2px 12px}
.g-count:empty{display:none}
.dots{display:flex;gap:6px;justify-content:center;margin:-4px 0 18px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--cream);border:2px solid var(--ink)}
.dots i.ok{background:#5FD39A} .dots i.no{background:#FF8E78} .dots i.now{background:var(--sun);transform:scale(1.25)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-bottom:20px}
.pic{font-size:3.6rem;line-height:1.1}
.de{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;overflow-wrap:anywhere}
.en{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,6vw,2.7rem);color:var(--grape-deep);line-height:1.1;overflow-wrap:anywhere}
.flip{max-width:520px;margin:0 auto 22px;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--card);border:var(--ol);border-radius:28px;padding:24px;cursor:pointer;box-shadow:0 8px 0 var(--ink)}
.flip.open{animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
.hint{color:var(--muted);font-size:1rem}
.say{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--ink);border:var(--ol);border-radius:99px;padding:6px 16px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.say svg{width:20px;height:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.opt{min-height:68px;font-size:1.3rem;font-family:var(--f-display);font-weight:600;background:var(--card);border:var(--ol);border-radius:18px;padding:10px;cursor:pointer;overflow-wrap:anywhere;touch-action:manipulation;box-shadow:0 5px 0 var(--ink)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.right{background:var(--good-soft);color:var(--good);animation:pop .3s}
.opt.wrong{background:var(--bad-soft);color:var(--bad)}
@media (max-width:360px){.opts{grid-template-columns:1fr}}
.answer{display:flex;gap:10px;max-width:560px;margin:0 auto;flex-wrap:wrap}
.type-in{flex:1 1 220px;min-width:0;font:600 1.7rem/1.2 var(--f-body);padding:12px 16px;border-radius:18px;border:var(--ol);background:var(--card);color:var(--ink);box-shadow:inset 0 3px 0 rgba(27,36,69,.08)}
.type-in:focus{outline:none;border-color:var(--grape-deep);box-shadow:0 0 0 4px var(--grape)}
.type-in.ok{background:var(--good-soft)}
.fb{min-height:64px;text-align:center;margin:16px auto 0;max-width:560px;font-weight:600;font-size:1.15rem}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.fb .sol{display:block;font-family:var(--f-display);font-size:1.9rem;color:var(--ink);margin-top:2px;letter-spacing:.02em}
.big-say{display:inline-flex;align-items:center;gap:10px;font-size:1.35rem;padding:16px 30px;min-height:76px;border-radius:99px}
.big-say svg{width:30px;height:30px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 24px}
.slot{width:42px;height:54px;border-bottom:4px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.8rem}
.slot.space{width:16px;border:0}
.slot.filled{border-color:var(--ink)}
.slot.next{border-color:var(--grape)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:620px;margin:0 auto}
.lt{width:58px;height:58px;border-radius:16px;background:var(--cream);border:var(--ol);box-shadow:0 4px 0 var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.7rem;cursor:pointer;touch-action:manipulation}
.lt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lt.used{visibility:hidden}
.lt.glow{background:var(--sun)}
.codegrid{display:grid;grid-template-columns:repeat(3,90px);gap:14px;justify-content:center;margin:0 auto}
.cbtn{width:90px;height:90px;border-radius:24px;background:var(--card);border:var(--ol);box-shadow:0 5px 0 var(--ink);font-size:2.7rem;cursor:pointer;touch-action:manipulation}
.cbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#cs .slot{width:66px;height:66px;font-size:2.3rem;background:var(--cream);border:var(--ol);border-radius:18px}
#cs .slot.filled{background:var(--sun-soft)}
.arow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 6px;border-bottom:2px dashed var(--line)}
.arow .wp{font-size:1.5rem;text-align:center}
.arow .wt b{display:block;font-family:var(--f-display);font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.arow .abtns{grid-column:2 / -1;gap:10px}
.arow .astate{font-size:.88rem;font-weight:600;color:var(--muted);text-align:right}
.arow .astate.ok{color:var(--good)} .arow .astate.err{color:var(--bad);text-align:left;grid-column:2 / -1}
.arow .astate.live{color:var(--bad);animation:pulse 1s infinite}
.arow.recording{background:var(--bad-soft);border-radius:16px}
.btn.rec{background:#FF9B87;box-shadow:0 4px 0 #C9604B}
@keyframes pulse{50%{opacity:.4}}
.wimg{display:block;object-fit:contain;-webkit-user-drag:none;user-select:none}
.pic .wimg{width:clamp(120px,28vw,170px);height:clamp(120px,28vw,170px);margin:0 auto}
.wp .wimg{width:38px;height:38px;margin:0 auto}
.mpic .wimg{width:min(66px,80%);height:auto;aspect-ratio:1;margin:0 auto}
.tpic .wimg{display:inline-block;width:46px;height:46px;vertical-align:middle}
.sync{font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.sync.off{color:var(--warn)} .sync.ok{color:var(--good)}
.codecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.codecard{border:3px dashed var(--ink);background:var(--cream);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.codecard b{overflow-wrap:anywhere;font-weight:600}
.codecard span{font-size:2.3rem;letter-spacing:6px}
@media print{body{background:#fff}.scene,.bar,.hello,.note,.tabs,.no-print{display:none!important}.printable{border:0;padding:0;box-shadow:none;background:#fff}.codecards{grid-template-columns:repeat(4,1fr)}.codecard{break-inside:avoid;color:#000;border-color:#999;background:#fff}}
.shake{animation:shake .35s}

/* torchlight */
.torch-task{text-align:center;font-size:1.25rem;margin-bottom:12px}
.torch-task b{font-family:var(--f-display);font-size:1.8rem}
.torch{position:relative;height:clamp(330px,58vh,520px);border-radius:26px;border:var(--ol);box-shadow:0 6px 0 var(--ink);overflow:hidden;background:var(--torch-bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.t-word{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));background:none;border:0;color:var(--torch-word);font-family:var(--f-display);font-weight:700;font-size:clamp(1.1rem,3.4vw,1.55rem);white-space:nowrap;padding:12px;z-index:1;cursor:pointer}
.t-word.found{z-index:3;color:var(--torch-found);text-shadow:0 0 18px rgba(255,205,69,.75)}
.t-word.nope{color:#FF9B87}
.t-dark{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,235,160,.22) 0,rgba(255,235,160,.08) calc(var(--rad,115px) * .55),#0A0D1C var(--rad,115px))}
.torch.empty .t-dark{background:#0A0D1C}
.t-word{animation:drift var(--d,7s) ease-in-out infinite alternate}
.t-word.found{animation:none;transform:translate(-50%,-50%) scale(1.15)}
@keyframes drift{from{transform:translate(-50%,-50%) translate(calc(var(--mx) * -1),calc(var(--my) * -1)) rotate(var(--rot,0deg))}to{transform:translate(-50%,-50%) translate(var(--mx),var(--my)) rotate(calc(var(--rot,0deg) * -1))}}
.stars-sky{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 34% 8%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 58% 22%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 80% 12%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 22% 44%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 68% 52%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 90% 70%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 8% 80%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 46% 88%,#fff 50%,transparent 51%);opacity:.55;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.t-moon{position:absolute;right:16px;top:12px;width:62px;height:62px;z-index:3;pointer-events:none}
.torch-top{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.torch-top .torch-task{margin:0}
.battery{position:relative;width:110px;height:34px;border:var(--ol);border-radius:9px;background:var(--cream)}
.battery .b-cap{position:absolute;right:-9px;top:8px;width:6px;height:12px;background:var(--ink);border-radius:0 3px 3px 0}
.battery .b-fill{position:absolute;left:3px;top:3px;bottom:3px;border-radius:5px;background:#5FD39A;transition:width .3s,background .3s;max-width:calc(100% - 6px)}
.battery .b-fill.mid{background:var(--sun)} .battery .b-fill.low{background:#FF8E78;animation:pulse .8s infinite}
.battery .b-pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}

/* effects */
.fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.conf{position:absolute;width:11px;height:15px;margin:-7px 0 0 -5px;border:2px solid var(--ink);border-radius:3px;animation:conf .95s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),calc(var(--dy) + 120px)) rotate(var(--r));opacity:0}}
.burst{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,4vw,2rem);white-space:nowrap;padding:4px 16px;border:var(--ol);border-radius:99px;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--ink);animation:burst 1s ease-out forwards}

.balloon.popped,.balloon.miss{animation-play-state:paused;pointer-events:none}

<script>
/* ============================================================
   HIER DIE ADRESSE DEINES GOOGLE-SKRIPTS EINFÜGEN (endet auf /exec)
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbwJOk26FUmELTYpO9ih1RdIWlcYNg4EqD97PV7Z0AL_eLy8tR0sIdfR8XmsVMQ7mwWsKA/exec";

/* ============================================================
   KLASSEN-EINSTELLUNGEN  (Claude ersetzt diese Liste, wenn neue Vokabeln kommen)
   Format pro Wort: [Deutsch, Englisch (Alternativen mit /), Bild-Emoji optional]
   ============================================================ */
const DEFAULT_CONFIG = {
  minutes: 5,
  sampleNames: false,
  sampleWords: true,
  inactive: [],
  students: [],   /* Namen stehen in der Google-Tabelle, Blatt "Namen" */
  units: [
    { title: "Unit 1 · In the classroom", words: [
      ["Lineal","ruler","📏"],["Bleistift","pencil","✏️"],["Radiergummi","rubber/eraser",""],
      ["Schultasche","schoolbag","🎒"],["Buch","book","📕"],["Heft","exercise book","📓"],
      ["Schere","scissors","✂️"],["Kleber","glue",""],["Tafel","board",""],
      ["Klassenzimmer","classroom","🏫"],["Lehrer / Lehrerin","teacher","🧑‍🏫"],["Spitzer","sharpener",""],
      ["Füllfeder","pen","🖋️"],["Tisch","desk",""]
    ]},
    { title: "Unit 2 · Pets and animals", words: [
      ["Hund","dog","🐶"],["Katze","cat","🐱"],["Pferd","horse","🐴"],["Maus","mouse","🐭"],
      ["Vogel","bird","🐦"],["Kaninchen","rabbit","🐰"],["Schildkröte","tortoise","🐢"],
      ["Fisch","fish","🐟"],["Kuh","cow","🐮"],["Schwein","pig","🐷"]
    ]}
  ]
};

/* ---------- Speicher: Google-Tabelle über Google Apps Script (Code.gs) ---------- */
const apiReady = /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
async function api(action, body){
  if (!apiReady) throw new Error("setup");
  let r, d = null;
  /* text/plain vermeidet eine CORS-Vorabfrage, die Google nicht beantwortet */
  try { r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({action}, body || {})), redirect:"follow", cache:"no-store"}); }
  catch(e){ throw new Error("offline"); }
  try { d = await r.json(); } catch(e){}
  if (!r.ok || !d || d.error) throw new Error((d && d.error) || ("http" + r.status));
  return d;
}
const memLocal = {};
const local = {
  get(k, d){ try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch(e){} return k in memLocal ? memLocal[k] : d; },
  set(k, v){ memLocal[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let cfg = Object.assign({}, DEFAULT_CONFIG), P = {}, curCode = null, teacherPin = null, codes = {}, pinDefault = false, serverDown = false;
function applyCfg(c){ cfg = Object.assign({}, DEFAULT_CONFIG, c || {}); if (!Array.isArray(cfg.inactive)) cfg.inactive = []; if (!cfg.audio || typeof cfg.audio !== "object") cfg.audio = {}; local.set("vz_cfg_cache", c || {}); }
async function loadConfig(){
  try { const d = await api("config"); applyCfg(d.config); serverDown = false; }
  catch(e){ applyCfg(local.get("vz_cfg_cache", {})); serverDown = true; }
}
async function saveCfg(patch){
  const d = await api("saveConfig", {pin: teacherPin, patch});
  if (patch.newPin){ teacherPin = patch.newPin; pinDefault = false; }
  applyCfg(d.config);
}
/* Fortschritt: sofort lokal zwischengespeichert, dann an Google geschickt.
   Ohne WLAN bleibt er auf dem iPad liegen und wird beim nächsten Mal nachgeschickt. */
let pushT = null, saveVer = 0, flushing = false;
function saveP(){
  if (!cur || !stu) return;
  const pend = local.get("vz_pending", {});
  pend[cur] = {code: curCode, data: stu, v: ++saveVer + "-" + Date.now()};
  local.set("vz_pending", pend);
  setSync("wait");
  /* höchstens alle 6 Sekunden an Google schicken, damit 17 Kinder gleichzeitig kein Limit erreichen */
  if (!pushT) pushT = setTimeout(flush, 6000);
}
async function flush(){
  clearTimeout(pushT); pushT = null;
  if (flushing){ pushT = setTimeout(flush, 1500); return; }
  flushing = true;
  let failed = false;
  for (const [name, p] of Object.entries(local.get("vz_pending", {}))){
    try {
      await api("save", {name, code: p.code, data: p.data});
      const now = local.get("vz_pending", {});
      if (now[name] && now[name].v === p.v){ delete now[name]; local.set("vz_pending", now); }
    } catch(e){
      if (e.message === "setup") break;
      if (e.message === "code" || e.message === "name"){ const now = local.get("vz_pending", {}); delete now[name]; local.set("vz_pending", now); }
      else failed = true;
    }
  }
  flushing = false;
  setSync(failed ? "off" : "ok");
  if (failed){ clearTimeout(pushT); pushT = setTimeout(flush, 15000); }
}
function setSync(state){
  const el = document.getElementById("sync"); if (!el) return;
  el.className = "sync " + state;
  el.textContent = state === "ok" ? "✓ gespeichert" : state === "wait" ? "speichert …" : "⚠ offline – wird nachgeholt";
}
function mergeStu(a, b){
  const t = {w: Object.assign({}, (a && a.w) || {}), sessions: ((a && a.sessions) || []).slice()};
  for (const [k, s] of Object.entries((b && b.w) || {})){ if (!t.w[k] || (s.t||0) >= (t.w[k].t||0)) t.w[k] = s; }
  for (const se of ((b && b.sessions) || [])){ if (!t.sessions.some(x => x.s === se.s)) t.sessions.push(se); }
  t.sessions.sort((x, y) => x.s - y.s);
  return t;
}

/* ---------- Helfer ---------- */
const $ = (s, r=document) => r.querySelector(s);
const app = $("#app"), bar = $("#bar"), overlay = $("#overlay");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"");
const DAY = 864e5;
/* Englisch 1× pro Woche: gekonnte Wörter kommen nach 1, 2, 4 und 8 Wochen wieder (je 1 Tag Spielraum) */
const INTERVAL = {3:6*DAY, 4:13*DAY, 5:27*DAY, 6:55*DAY};
/* Geheimzeichen: werden im Google-Skript geprüft (geheimer Schlüssel), gleiche Reihenfolge wie dort */
const SYMBOLS = ["🍎","🚲","⚽","🌙","🐸","🎈","🌻","🚀","🍕"];
const firstEn = w => w.en.split("/")[0].trim();
const showEn = w => w.en.split("/").map(s=>s.trim()).join(" / ");
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };

function accept(input, en){
  const a = norm(input); if (!a) return false;
  const strip = x => x.replace(/^(to|a|an|the) /,"");
  return en.split("/").map(norm).filter(Boolean).some(v => v===a || strip(v)===a || strip(a)===v || strip(a)===strip(v));
}
function lev(a, b){
  a=norm(a); b=norm(b); const m=a.length, n=b.length; if (!m||!n) return Math.max(m,n);
  let prev = Array.from({length:n+1},(_,i)=>i);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}

const FUN_VOICES = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|eddy|flo|fred|good news|grandma|grandpa|jester|junior|kathy|organ|ralph|reed|rocko|sandy|shelley|superstar|trinoids|whisper|wobble|zarvox)\b/i;
function enVoices(){
  try { return speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !FUN_VOICES.test(v.name)); } catch(e){ return []; }
}
/* Safari nennt Premium- und einfache Stimme oft gleich ("Serena") – unterscheiden lassen sie sich nur über voiceURI */
const voiceId = v => v.voiceURI || v.name;
function voiceQuality(v){
  const t = v.name + " " + (v.voiceURI || "");
  return /premium/i.test(t) ? "Premium" : /enhanced|erweitert|neural|natural/i.test(t) ? "Erweitert" : "";
}
function voiceScore(v){
  let s = 0; const n = v.name + " " + (v.voiceURI || "");
  if (/premium/i.test(n)) s += 12;
  if (/enhanced|erweitert|neural|natural/i.test(n)) s += 9;
  if (/google uk english/i.test(n)) s += 6;
  if (/^(serena|daniel|kate|arthur|martha|stephanie|oliver|jamie|karen|moira|samantha)\b/i.test(n)) s += 3;
  if (/^en[-_]gb/i.test(v.lang)) s += 4; else if (/^en[-_](ie|au|us)/i.test(v.lang)) s += 1;
  if (v.localService) s += 1;
  return s;
}
function pickVoice(){
  const vs = enVoices(); if (!vs.length) return null;
  let saved = null; try { saved = localStorage.getItem("vz_voice"); } catch(e){}
  const mine = saved && (vs.find(v => voiceId(v) === saved) || vs.find(v => v.name === saved));
  return mine || vs.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0];
}
function speak(text, slow, voice){
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voice || pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";

    speechSynthesis.speak(u);

   Gespeichert im Blatt "Aufnahmen". Abgespielt über Web Audio (funktioniert am iPad auch ohne direkten Tipp,
   sobald die Seite einmal berührt wurde). Ohne Aufnahme liest die iPad-Stimme vor. */
let actx = null;
const audioBuf = {};                      // key -> {ver, buf}
function unlockAudio(){
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === "suspended") actx.resume();
    const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0);
  } catch(e){}
}
["pointerdown","touchend","keydown"].forEach(t => document.addEventListener(t, unlockAudio, {passive:true}));
function audioStore(){ return local.get("vz_audio", {}); }
function b64ToBuf(b64){ const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a.buffer; }
function decode(ab){ return new Promise((ok, no) => { try { const r = actx.decodeAudioData(ab, ok, no); if (r && r.then) r.then(ok, no); } catch(e){ no(e); } }); }
/* Stille am Anfang und Ende abschneiden (der Tipp auf "Aufnehmen" dauert immer einen Moment) */
function trimmed(buf){
  const d = buf.getChannelData(0), thr = 0.03, sr = buf.sampleRate;
  let a = 0, z = d.length - 1;
  while (a < d.length && Math.abs(d[a]) < thr) a++;
  while (z > a && Math.abs(d[z]) < thr) z--;
  if (a >= z) return {start: 0, dur: buf.duration};
  const start = Math.max(0, a / sr - 0.08), end = Math.min(buf.duration, z / sr + 0.2);
  return {start, dur: end - start};
}
async function getBuf(key){
  const ver = (cfg.audio || {})[key]; if (!ver || !actx) return null;
  if (audioBuf[key] && audioBuf[key].ver === ver) return audioBuf[key].buf;
  const rec = audioStore()[key];
  if (!rec || rec.ver !== ver) return null;
  try { const buf = await decode(b64ToBuf(rec.data)); audioBuf[key] = {ver, buf}; return buf; } catch(e){ return null; }
}
let curSrc = null;
function playBuf(buf){
  try { if (curSrc) curSrc.stop(); } catch(e){}
  const t = trimmed(buf), src = actx.createBufferSource();
  src.buffer = buf; src.connect(actx.destination); src.start(0, t.start, t.dur); curSrc = src;
}
/* Ein Wort vorlesen: eigene Aufnahme, wenn vorhanden, sonst iPad-Stimme */
function sayWord(w){
  const key = w.key;
  const text = firstEn(w);
  if (!(cfg.audio || {})[key] || !actx){ speak(text); return; }
  try { if (canSpeak) speechSynthesis.cancel(); } catch(e){}
  getBuf(key).then(buf => { if (buf) playBuf(buf); else speak(text); });
}

async function prefetchAudio(){
  const idx = cfg.audio || {}; if (!apiReady) return;
  const st = audioStore(), need = Object.keys(idx).filter(k => !st[k] || st[k].ver !== idx[k]);
  let changed = false;
  for (const k of Object.keys(st)) if (!idx[k]){ delete st[k]; changed = true; }
  if (need.length){
    try { const d = await api("audio", {keys: need}); Object.assign(st, d.audio || {}); changed = true; } catch(e){}
  }
  if (changed) local.set("vz_audio", st);
}

function words(all){
  const seen = new Set(), out = [];
  for (const u of cfg.units){
    if (!all && cfg.inactive.includes(u.title)) continue;
    for (const [de, en, emoji] of u.words){
      const key = norm(String(en).split("/")[0]);
      if (!key || seen.has(key)) continue;
      seen.add(key); out.push({de, en, emoji: emoji||"", unit: u.title, key});
    }
  }
  return out;
}
/* Bild eines Wortes: Emoji oder Bilddatei (z. B. bilder/swim.svg oder https://…) */
const isImgRef = v => /^(https?:\/\/|data:image\/)/i.test(v) || /^[\w\-.\/]+\.(svg|png|jpe?g|gif|webp)$/i.test(v);
function pic(w){

}
function getStu(name){ return P[name] || (P[name] = {w:{}, sessions:[]}); }
const st = (stu, w) => (stu && stu.w[w.key]) || {l:0, d:0, r:0, f:0};
function stats(stu, list){
  const now = Date.now(); let mastered=0, near=0, back=0, due=0;
  for (const w of list){ const s = st(stu,w);
    if (s.l>=3){ mastered++; if (s.d<=now) due++; }
    else { if (s.l>=2) near++; if (s.back) back++; } }
  return {total:list.length, mastered, near, back, due, practice:list.length-mastered};
}

let cur = null, stu = null, sess = null, timerId = null;

/* Kern der Wiederholungslogik:
   - Üben: richtig geschrieben (Schreiben/Diktat) = +1 Stern, richtig erkannt (andere Spiele) = +½ Stern bis max. 2.
   - "Gekonnt" = 3 Sterne UND an mindestens 2 verschiedenen Tagen richtig geschrieben.
   - Gekonnte Wörter kommen nur nach 2 → 5 → 12 → 30 Tagen wieder dran.
   - Gekonntes Wort falsch geschrieben / vergessen → zurück in die Übungsliste. */
function record(w, ok, typed, soft){
  const s = stu.w[w.key] || (stu.w[w.key] = {l:0, d:0, r:0, f:0});
  const now = Date.now();
  sess.answers++; if (ok) sess.correct++;
  if (ok){
    s.r = (s.r||0)+1;
    if (typed){ s.dy = s.dy||[]; const t=todayStr(); if (!s.dy.includes(t)){ s.dy.push(t); if (s.dy.length>6) s.dy.shift(); } }
    if (s.l < 3){
      if (typed) s.l += 1; else if (s.l < 2) s.l = Math.min(2, s.l + 0.5);
      if (s.l >= 3){
        if ((s.dy||[]).length >= 2){ s.l = 3; s.d = now + INTERVAL[3]; s.back = false; sess.mastered.push(w); }
        else s.l = 2.5;
      }
    } else if (typed){ s.l = Math.min(6, Math.floor(s.l)+1); s.d = now + INTERVAL[s.l]; }
    else if (s.d <= now) s.d = now + DAY;
  } else {
    s.f = (s.f||0)+1;
    if (s.l >= 3){
      if (soft) s.d = now;
      else { s.l = 1; s.back = true; s.dy = []; sess.relapsed.push(w); }
    } else s.l = Math.max(0, Math.floor(s.l) - 1);
  }
  s.t = now;
  saveSession();
}
function saveSession(){
  const sec = Math.min(3600, Math.round((Date.now()-sess.start)/1000));
  let e = stu.sessions.find(x => x.s === sess.start);
  if (!e){ e = {s: sess.start}; stu.sessions.push(e); if (stu.sessions.length>200) stu.sessions.shift(); }
  e.sec = sec; e.a = sess.answers; e.c = sess.correct;
  saveP();
}
function isReview(w){ return st(stu,w).l >= 3; }

function pick(n){
  const list = words(); if (!list.length) return [];
  const now = Date.now();
  const practice = shuffle(list.filter(w => st(stu,w).l < 3))
    .sort((a,b) => (st(stu,b).back?1:0)-(st(stu,a).back?1:0) || Math.floor(st(stu,a).l)-Math.floor(st(stu,b).l));
  const due = shuffle(list.filter(w => st(stu,w).l >= 3 && st(stu,w).d <= now));
  const reviewN = practice.length ? Math.min(due.length, Math.max(1, Math.round(n*0.25))) : n;
  const out = due.slice(0, reviewN);
  for (const w of practice){ if (out.length >= n) break; out.push(w); }
  if (out.length < n){
    const rest = list.filter(w => !out.includes(w)).sort((a,b)=>st(stu,a).d - st(stu,b).d);
    for (const w of rest){ if (out.length >= n) break; out.push(w); }
  }
  return shuffle(out);
}

function login(name, code, data){
  cur = name; curCode = code;
  const pend = local.get("vz_pending", {})[name];
  stu = mergeStu(data || {w:{}, sessions:[]}, pend && pend.data);
  sess = {start: Date.now(), answers:0, correct:0, mastered:[], relapsed:[], ended:false};
  clearInterval(timerId); timerId = setInterval(tick, 1000);
  showHome();
  if (pend) saveP();
}
function logout(){ if (sess && sess.answers) saveSession(); flush(); showLogin(); }

  const list = words(), s = stats(stu, list);
  const pct = v => s.total ? (v/s.total*100).toFixed(1) : 0;

  else if (s.near) tip = `<p class="note"><b>${s.near} ${s.near===1?"Wort ist":"Wörter sind"} fast geschafft.</b> Schreib sie bei <b>Schreiben</b> oder <b>Diktat</b> richtig – in zwei verschiedenen Englischstunden – dann sind sie gekonnt.</p>`;
  else if (s.total && s.mastered === s.total) tip = `<p class="note"><b>Alle Wörter gekonnt!</b> Jetzt kommen nur noch Wiederholungen, damit du sie nicht vergisst.</p>`;
  app.innerHTML = `
    <section class="hello hero">${MASCOT}<div class="txt"><p class="eyebrow">${cfg.minutes} Minuten Vokabeln</p><h1>Hallo ${esc(cur)}!</h1></div></section>

      <div class="row"><h3>${s.mastered} von ${s.total} Wörtern gekonnt</h3><span class="spacer"></span><button class="link" id="seeWords">Alle ansehen</button></div>

        <span class="seg-good" style="width:${pct(s.mastered)}%"></span><span class="seg-near" style="width:${pct(s.near)}%"></span></div>
      <div class="legend"><span><i class="seg-good"></i>gekonnt <b>${s.mastered}</b></span><span><i class="seg-near"></i>fast <b>${s.near}</b></span><span><i style="background:var(--line)"></i>noch üben <b>${s.total-s.mastered-s.near}</b></span>${s.due?`<span>zum Wiederholen <b>${s.due}</b></span>`:""}</div>
    </div>

      return `<button class="tile" data-g="${g.id}" ${off?"disabled":""}><span class="ti-ic">${IC[g.icon]}</span>
        <span class="ti-name">${g.name}</span><span class="ti-desc">${g.id==="listen"&&!canSpeak?"Auf diesem Gerät gibt es keine Vorlesestimme.":g.desc}</span>

  app.querySelectorAll(".tile").forEach(b => b.onclick = () => GAMES.find(g=>g.id===b.dataset.g).fn());

/* ---------- Meine Wörter ---------- */
function starHTML(l){ const v = Math.min(3, Math.floor(l*2)/2); return `<span class="stars" aria-label="${String(v).replace(".",",")} von 3 Sternen">${[0,1,2].map(i=>`<span class="${v>=i+1?"on":v>=i+0.5?"half":""}">★</span>`).join("")}</span>`; }
function statusHTML(s){
  if (s.l >= 3) return `<span class="chip good">gekonnt</span>`;
  if (s.back) return `<span class="chip warn">wieder üben</span>`;
  return starHTML(s.l);
}
function wordRows(who, filter){
  const list = words(); let h = "", unit = null, count = 0;
  for (const w of list){
    const s = st(who, w);
    if (filter==="practice" && s.l>=3) continue;
    if (filter==="mastered" && s.l<3) continue;
    if (w.unit !== unit){ unit = w.unit; h += `<p class="unit-h">${esc(unit)}</p>`; }
    count++;
    h += `<div class="wrow"><span class="wp">${pic(w)}</span><span class="wt"><b>${esc(w.de)}</b><span>${esc(showEn(w))}</span></span>${statusHTML(s)}</div>`;
  }
  return count ? h : `<p class="muted" style="padding:18px 0">${filter==="mastered"?"Noch keine Wörter gekonnt – das kommt!":"Hier ist gerade nichts."}</p>`;
}
function showWords(filter){
  renderBar("student");
  const s = stats(stu, words());
  app.innerHTML = `
    <div class="g-head"><button class="btn ghost sm" id="back">← Spiele</button><h2>Meine Wörter</h2></div>
    <div class="row" style="margin-bottom:8px"><div class="seg" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="${filter==="all"}">Alle ${s.total}</button>
      <button data-f="practice" aria-pressed="${filter==="practice"}">Noch üben ${s.practice}</button>
      <button data-f="mastered" aria-pressed="${filter==="mastered"}">Gekonnt ${s.mastered}</button></div></div>
    <p class="muted small">★ = einmal richtig geschrieben (Schreiben, Diktat) · ½ ★ = richtig erkannt in den anderen Spielen.</p>
    <div class="card wlist" style="margin-top:12px">${wordRows(stu, filter)}</div>`;
  $("#back").onclick = showHome;
  app.querySelectorAll(".seg button").forEach(b => b.onclick = () => showWords(b.dataset.f));
  window.scrollTo(0,0);
}

/* ---------- Spiel-Rahmen ---------- */
let gtok = 0;
function stopGame(){ gtok++; if (canSpeak) try{ speechSynthesis.cancel(); }catch(e){} }
function later(fn, ms){ const t = gtok; setTimeout(() => { if (t === gtok) fn(); }, ms); }
function shell(title){
  stopGame(); renderBar("student");
  app.innerHTML = `<div class="g-head"><button class="btn ghost sm" id="gback">← Spiele</button><h2>${title}</h2><span class="g-count" id="gcount"></span></div><div id="dots" class="dots"></div><div id="gb"></div>`;
  $("#gback").onclick = showHome;
  window.scrollTo(0,0);
  return $("#gb");
}
function dots(res, total){
  const el = $("#dots"); if (!el) return;
  el.innerHTML = Array.from({length: total}, (_, i) => `<i class="${i<res.length ? (res[i].ok?"ok":"no") : i===res.length ? "now" : ""}"></i>`).join("");
  $("#gcount").textContent = `${Math.min(res.length+1,total)} / ${total}`;
}
function promptHTML(w){
  return `<div class="prompt">${w.emoji?`<span class="pic" aria-hidden="true">${pic(w)}</span>`:""}<p class="de">${esc(w.de)}</p>${isReview(w)?`<span class="chip plain">Wiederholung</span>`:""}</div>`;
}
function noWords(){ const b = shell("Hoppla"); b.innerHTML = `<p class="note">Für dieses Spiel sind zu wenige Vokabeln eingetragen.</p>`; }
function finish(title, res, again, mastBefore){
  const ok = res.filter(r=>r.ok).length;
  const fresh = sess.mastered.slice(mastBefore);
  const allOk = res.length && ok === res.length;
  if (ok * 2 >= res.length) sfx("win");
  if (allOk) setTimeout(() => confetti(null, 40), 150);
  $("#dots").innerHTML = ""; $("#gcount").textContent = "";
  $("#gb").innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">
    <p class="eyebrow">${title} · Runde fertig</p><h2>${allOk ? "Perfect! " : ok * 2 >= res.length ? "Well done! " : "Keep going! "}${ok} von ${res.length} richtig</h2>
    ${fresh.length ? `<p class="note" style="margin-top:12px">⭐ Neu gekonnt: <b>${fresh.map(w=>esc(firstEn(w))).join(", ")}</b></p>` : ""}
    <ul class="res-list">${res.map(r => `<li class="${r.ok?"ok":"no"}"><span class="mk">${r.ok?"✓":"✗"}</span><b>${esc(showEn(r.w))}</b><span class="muted">${esc(r.w.de)}</span></li>`).join("")}</ul>
    <div class="row"><button class="btn" id="again">Nochmal</button><button class="btn ghost" id="other">Anderes Spiel</button></div></div>`;
  $("#again").onclick = again; $("#other").onclick = showHome;
}
const sayBtn = (id="sayEn") => canSpeak ? `<button class="say" id="${id}" type="button">${IC.speaker}Anhören</button>` : "";

/* ---------- Soundeffekte (werden live erzeugt, keine Dateien) und Bildeffekte ---------- */
let soundOn = (() => { try { return localStorage.getItem("vz_sound") !== "off"; } catch(e){ return true; } })();
function sfx(name){
  if (!soundOn) return;
  unlockAudio(); if (!actx) return;
  try {
    const t = actx.currentTime + 0.01, out = actx.createGain(); out.gain.value = 0.32; out.connect(actx.destination);
    const tone = (f, s, d, type, vol, to) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type || "sine";
      o.frequency.setValueAtTime(f, t + s); if (to) o.frequency.exponentialRampToValueAtTime(to, t + s + d);
      g.gain.setValueAtTime(0.0001, t + s); g.gain.exponentialRampToValueAtTime(vol || .6, t + s + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
      o.connect(g); g.connect(out); o.start(t + s); o.stop(t + s + d + .05); };
    const noise = (s, d, vol, freq, q, to) => { const n = Math.floor(actx.sampleRate * d), buf = actx.createBuffer(1, n, actx.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); src.buffer = buf;
      f.type = "bandpass"; f.frequency.setValueAtTime(freq, t + s); if (to) f.frequency.exponentialRampToValueAtTime(to, t + s + d); f.Q.value = q || 1; g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(out); src.start(t + s); };
    switch (name){
      case "flip":  noise(0, .22, 1.6, 600, .9, 3200); break;                                   /* Wusch */
      case "right": tone(784, 0, .13, "triangle", .7); tone(1175, .09, .3, "triangle", .7); break;  /* Ding-Ding */
      case "wrong": tone(196, 0, .16, "square", .22, 175); tone(147, .15, .32, "square", .22, 110); break; /* Bwomp */
      case "tick":  tone(1400, 0, .05, "triangle", .45); break;
      case "buzz":  tone(150, 0, .2, "sawtooth", .16, 120); break;
      case "pop":   noise(0, .14, 3, 1400, .7); tone(1000, 0, .07, "sine", .45, 260); break;   /* Plopp */
      case "match": tone(660, 0, .11, "triangle", .6); tone(990, .08, .22, "triangle", .6); break;
      case "spark": [1568, 1976, 2349, 3136].forEach((f, i) => tone(f, i * .05, .2, "sine", .3)); break;
      case "win":   [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .2, "triangle", .55)); tone(1319, .38, .45, "triangle", .5); break;
    }
  } catch(e){}
}
const PRAISE = ["Correct!", "Great job!", "Well done!", "Super!", "Awesome!", "Yes!"];
const praise = () => PRAISE[Math.random() * PRAISE.length | 0];
function centerOf(el){ const r = el ? el.getBoundingClientRect() : {left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0}; return [r.left + r.width / 2, r.top + r.height / 2]; }
function confetti(el, n){
  const [cx, cy] = centerOf(el), layer = document.createElement("div"); layer.className = "fx"; document.body.appendChild(layer);
  for (let i = 0; i < (n || 18); i++){
    const s = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 110;
    s.className = "conf"; s.style.cssText = `left:${cx}px;top:${cy}px;--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d - 50).toFixed(0)}px;--r:${Math.random() * 540 | 0}deg;background:${BALLOON_COLORS[i % 6]}`;
    layer.appendChild(s);
  }
  setTimeout(() => layer.remove(), 1100);
}
function burst(el, text, kind){
  const [cx, cy] = centerOf(el), layer = document.createElement("div"); layer.className = "fx"; document.body.appendChild(layer);
  const s = document.createElement("span"); s.className = "burst " + (kind || "good"); s.textContent = text; s.style.left = cx + "px"; s.style.top = cy + "px";
  layer.appendChild(s); setTimeout(() => layer.remove(), 1100);
}
const BALLOON_COLORS = ["#FF8E78","#FFCD45","#8FE5C9","#A487F0","#7CC4FF","#F7A5B6"];

/* 1 · Karteikarten */
function gFlash(){
  const list = pick(8); if (!list.length) return noWords();
  const b = shell("Karteikarten"), res = [], m0 = sess.mastered.length; let i = 0;
  const step = () => {
    if (i >= list.length) return finish("Karteikarten", res, gFlash, m0);
    const w = list[i]; dots(res, list.length);
    b.innerHTML = `<div class="flip-wrap"><div class="flip" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">${promptHTML(w)}<p class="hint">Weißt du das englische Wort? Sag es leise – dann tippe auf die Karte.</p></div></div>
      <div class="row center" id="acts"><button class="btn" id="turn">Umdrehen</button></div>`;
    const reveal = () => {
      const c = $("#card"); if (c.classList.contains("open") || c.classList.contains("turning")) return;
      sfx("flip"); c.classList.add("turning");
      setTimeout(() => {
        c.classList.remove("turning"); c.classList.add("open"); c.removeAttribute("role");
        c.innerHTML = `${w.emoji?`<span class="pic">${pic(w)}</span>`:""}<p class="muted">${esc(w.de)}</p><p class="en">${esc(showEn(w))}</p>${sayBtn()}`;
        sayWord(w);
        if ($("#sayEn")) $("#sayEn").onclick = e => { e.stopPropagation(); sayWord(w); };
        $("#acts").innerHTML = `<button class="btn good" id="yes">✓ Gewusst</button><button class="btn bad" id="no">✗ Noch nicht</button>`;
        $("#yes").onclick = () => { sfx("right"); record(w, true, false); res.push({w, ok:true}); i++; step(); };
        $("#no").onclick  = () => { record(w, false, false); res.push({w, ok:false}); i++; step(); };
      }, 180);
    };
    $("#card").onclick = reveal; $("#turn").onclick = reveal;
    $("#card").onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); reveal(); } };
  };
  step();
}

/* 2 · Quiz */
function gQuiz(){
  const list = pick(8); if (!list.length) return noWords();
  const pool = words().length >= 4 ? words() : words(true);
  const b = shell("Quiz"), res = [], m0 = sess.mastered.length; let i = 0;
  const step = () => {
    if (i >= list.length) return finish("Quiz", res, gQuiz, m0);
    const w = list[i]; dots(res, list.length);
    const opts = shuffle([w, ...shuffle(pool.filter(x => x.key !== w.key)).slice(0, 3)]);
    b.innerHTML = `${promptHTML(w)}<div class="opts">${opts.map(o => `<button class="opt" data-k="${esc(o.key)}">${esc(firstEn(o))}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
    let done = false;
    b.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
      if (done) return; done = true;
      const ok = btn.dataset.k === w.key;
      b.querySelectorAll(".opt").forEach(o => { if (o.dataset.k === w.key) o.classList.add("right"); });
      if (!ok) btn.classList.add("wrong");
      record(w, ok, false); res.push({w, ok});
      if (ok){ sfx("right"); confetti(btn, 14); } else sfx("wrong");
      later(() => sayWord(w), 350);
      $("#fb").className = "fb big " + (ok ? "good" : "bad");
      $("#fb").innerHTML = ok ? esc(praise()) : `Oops! <span class="muted">${esc(w.de)} =</span> ${esc(showEn(w))}`;
      later(() => { i++; step(); }, ok ? 1200 : 2300);
    });
  };
  step();
}

/* 3 · Buchstabieren */
function gSpell(){
  const list = pick(6); if (!list.length) return noWords();
  const b = shell("Buchstabieren"), res = [], m0 = sess.mastered.length; let i = 0;
  const step = () => {
    if (i >= list.length) return finish("Buchstabieren", res, gSpell, m0);
    const w = list[i]; dots(res, list.length);
    const target = firstEn(w), chars = [...target];
    const need = chars.map((c, idx) => ({c, idx})).filter(x => x.c !== " ");
    let tiles = shuffle(need.map(x => x.c));
    if (tiles.join("") === need.map(x=>x.c).join("") && tiles.length > 1) tiles = tiles.reverse();
    let pos = 0, mistakes = 0, wrongHere = 0;
    b.innerHTML = `${promptHTML(w)}
      <div class="slots" id="slots">${chars.map(c => c===" " ? `<span class="slot space"></span>` : `<span class="slot"></span>`).join("")}</div>
      <div class="letters" id="letters">${tiles.map((c, k) => `<button class="lt" data-k="${k}" aria-label="Buchstabe ${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="row center" style="margin-top:16px"><button class="link" id="help">Tipp: nächster Buchstabe</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    const slots = [...b.querySelectorAll(".slot:not(.space)")];
    const mark = () => slots.forEach((s, k) => s.classList.toggle("next", k === pos));
    mark();
    const glow = () => { const want = need[pos].c.toLowerCase(); const t = [...b.querySelectorAll(".lt:not(.used)")].find(x => x.textContent.toLowerCase() === want); if (t) t.classList.add("glow"); };
    b.querySelectorAll(".lt").forEach(t => t.onclick = () => {
      if (pos >= need.length) return;
      if (t.textContent.toLowerCase() === need[pos].c.toLowerCase()){
        sfx("tick");
        const sl = slots[pos]; sl.textContent = need[pos].c; sl.classList.add("filled", "bounce");
        t.classList.add("used"); b.querySelectorAll(".lt.glow").forEach(x=>x.classList.remove("glow"));
        pos++; wrongHere = 0; mark();
        if (pos >= need.length){
          const ok = mistakes === 0;
          record(w, ok, false); res.push({w, ok});
          $("#slots").classList.add(ok ? "won" : "done");
          if (ok){ sfx("win"); confetti($("#slots"), 26); } else sfx("match");
          later(() => sayWord(w), 450);
          $("#fb").className = "fb big " + (ok ? "good" : "");
          $("#fb").textContent = ok ? "Perfect!" : "Good try! Next time without mistakes.";
          later(() => { i++; step(); }, 1600);
        }
      } else {
        mistakes++; wrongHere++; sfx("buzz");
        t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake", "bad-flash");
        setTimeout(() => t.classList.remove("bad-flash"), 400);
        if (wrongHere >= 2) glow();
      }
    });
    $("#help").onclick = () => { if (pos < need.length){ mistakes++; glow(); } };
  };
  step();
}

/* 4 · Schreiben & 5 · Diktat */
function gWrite(mode){
  const listen = mode === "listen";
  const list = pick(8); if (!list.length) return noWords();
  const title = listen ? "Diktat" : "Schreiben";
  const b = shell(title), res = [], m0 = sess.mastered.length; let i = 0;
  const step = (first) => {
    if (i >= list.length) return finish(title, res, () => gWrite(mode), m0);
    const w = list[i]; dots(res, list.length);
    const top = listen
      ? `<div class="prompt"><button class="btn big-say" id="say" type="button">${IC.speaker}Anhören</button>
           <div class="row center"><button class="link" id="hint" type="button">Deutsch zeigen</button></div>
           <p class="de" id="hintTxt" hidden>${w.emoji?`<span class="pic">${pic(w)}</span><br>`:""}${esc(w.de)}</p>${isReview(w)?`<span class="chip plain">Wiederholung</span>`:""}</div>`
      : promptHTML(w);
    b.innerHTML = `${top}
      <form class="answer" id="f" autocomplete="off">
        <input id="ans" class="type-in" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" placeholder="auf Englisch …" aria-label="Englisches Wort">
        <button class="btn" id="go">Prüfen</button></form>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="row center"><button class="link" id="dunno" type="button">Weiß ich nicht</button></div>`;
    const ans = $("#ans"), fb = $("#fb");
    let phase = "answer";
    if (listen){
      $("#say").onclick = () => { sayWord(w); ans.focus(); };
      $("#hint").onclick = () => { $("#hintTxt").hidden = false; $("#hint").hidden = true; };
      if (first) sayWord(w); else later(() => sayWord(w), 350);
    }
    ans.focus();
    const wrong = (near) => {
      record(w, false, true); res.push({w, ok:false}); phase = "copy"; sfx("wrong");
      fb.className = "fb bad";
      fb.innerHTML = `${near ? "Almost! Ein Buchstabe stimmt nicht." : "Oops!"} Richtig ist:<span class="sol">${esc(showEn(w))}</span><span class="muted small">Schreib es jetzt einmal richtig ab.</span>`;
      ans.value = ""; ans.focus(); later(() => sayWord(w), 400);
      $("#dunno").hidden = true;
    };
    $("#f").onsubmit = e => {
      e.preventDefault();
      const v = ans.value;
      if (!norm(v)) { ans.focus(); return; }
      if (phase === "answer"){
        if (accept(v, w.en)){
          const wasReview = isReview(w);
          record(w, true, true); res.push({w, ok:true}); phase = "done";
          ans.classList.add("ok"); ans.readOnly = true; sfx("right"); confetti(ans, 14);
          fb.className = "fb big good"; fb.textContent = wasReview ? "Correct! Still remembered!" : praise();
          later(() => sayWord(w), 350);
          later(() => { i++; step(); }, 1200);
        } else wrong(nearMiss(v, w.en));
      } else if (phase === "copy"){
        if (accept(v, w.en)){
          phase = "done"; ans.classList.add("ok"); ans.readOnly = true; sfx("match");
          fb.className = "fb good"; fb.textContent = "Good! Weiter geht’s.";
          later(() => { i++; step(); }, 800);
        } else { sfx("buzz"); ans.classList.remove("shake"); void ans.offsetWidth; ans.classList.add("shake"); }
      }
    };
    $("#dunno").onclick = () => { if (phase === "answer") wrong(false); };
  };
  step(true);
}

/* 6 · Torchlight: Nachtsuche mit Taschenlampe. Wörter schweben, Ablenkwörter, Batterie wird leer */
const MOON = '<svg class="t-moon" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="30" fill="#FFF0C4" stroke="#1B2445" stroke-width="3"/><circle cx="52" cy="26" r="5" fill="#F3DDA0"/><circle cx="28" cy="55" r="4" fill="#F3DDA0"/><ellipse cx="31" cy="40" rx="2.6" ry="3.4" fill="#1B2445"/><ellipse cx="47" cy="40" rx="2.6" ry="3.4" fill="#1B2445"/><path d="M35 47 q4 4 8 0" fill="none" stroke="#1B2445" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="24" cy="46" rx="4" ry="2.4" fill="#F7A5B6"/><ellipse cx="54" cy="46" rx="4" ry="2.4" fill="#F7A5B6"/></svg>';
function gTorch(){
  const list = pick(6); if (list.length < 3) return noWords();
  const decoys = shuffle(words(true).filter(x => !list.some(y => y.key === x.key))).slice(0, 3);
  const all = shuffle(list.concat(decoys));
  const b = shell("Torchlight"), res = [], m0 = sess.mastered.length;
  const order = shuffle(list); let r = 0, mistake = false, battery = 100, over = false;
  const cells = shuffle(all.map((_, k) => k)), rows = Math.ceil(all.length / 3);
  b.innerHTML = `<div class="torch-top"><p class="torch-task" id="task" aria-live="polite"></p>
      <div class="battery" aria-label="Batterie"><span class="b-cap"></span><span class="b-fill" id="bfill"></span><span class="b-pct" id="bpct">100%</span></div></div>
    <div class="torch" id="board">
      <span class="stars-sky"></span>${MOON}
      ${all.map((w, k) => { const c = cells[k], col = c % 3, row = Math.floor(c / 3);
        const x = (col + 0.24 + Math.random()*0.52) / 3 * 100, y = (row + 0.3 + Math.random()*0.4) / rows * 100, rot = (Math.random()*14-7).toFixed(1);
        const mx = (Math.random()*36-18).toFixed(0), my = (Math.random()*28-14).toFixed(0), d = (5 + Math.random()*4).toFixed(1);
        return `<button class="t-word" data-k="${esc(w.key)}" style="left:${x}%;top:${y}%;--rot:${rot}deg;--mx:${mx}px;--my:${my}px;--d:${d}s">${esc(firstEn(w))}</button>`; }).join("")}
      <div class="t-dark" id="dark"></div></div>
    <p class="muted center small" style="margin-top:10px">Zieh den Finger über das Bild – die Taschenlampe zeigt die Wörter. Schnell sein: Die Batterie wird leer! Jedes gefundene Wort lädt sie ein bisschen auf.</p>`;
  const board = $("#board"), dark = $("#dark");
  const light = (cx, cy) => { const rc = board.getBoundingClientRect(); dark.style.setProperty("--x", (cx-rc.left)+"px"); dark.style.setProperty("--y", (cy-rc.top)+"px"); };
  board.addEventListener("pointermove", e => light(e.clientX, e.clientY));
  board.addEventListener("pointerdown", e => light(e.clientX, e.clientY));
  const showBattery = () => {
    const v = Math.max(0, battery);
    $("#bfill").style.width = v + "%"; $("#bpct").textContent = Math.round(v) + "%";

  const t0 = gtok;
  const drain = setInterval(() => {
    if (t0 !== gtok || over){ clearInterval(drain); return; }
    battery -= 0.55; showBattery();
    if (battery <= 0){
      over = true; clearInterval(drain); sfx("wrong"); board.classList.add("empty");
      for (let k = r; k < order.length; k++) res.push({w: order[k], ok:false});   /* nicht gefunden – zählt nicht als Fehler im Lernstand */
      $("#task").innerHTML = `<b>Battery empty!</b> Die Lampe ist aus.`;
      later(() => finish("Torchlight", res, gTorch, m0), 1800);
    }
  }, 300);
  b.querySelectorAll(".t-word").forEach(btn => {
    btn.addEventListener("focus", () => { const rc = btn.getBoundingClientRect(); light(rc.left+rc.width/2, rc.top+rc.height/2); });
    btn.onclick = () => {
      if (over || r >= order.length || btn.classList.contains("found")) return;
      const w = order[r];
      if (btn.dataset.k === w.key){
        btn.classList.add("found"); sfx("spark"); burst(btn, mistake ? "Found it!" : praise()); later(() => sayWord(w), 300);
        record(w, !mistake, false, true); res.push({w, ok:!mistake});
        battery = Math.min(100, battery + 8); showBattery();
        r++; mistake = false;
        if (r >= order.length){ over = true; clearInterval(drain); confetti(board, 30); later(() => finish("Torchlight", res, gTorch, m0), 1300); } else task();
      } else {

      }
    };
  });

}

/* 7 · Memory: 10 Paare */
function gMemory(){
  const list = pick(10); if (list.length < 3) return noWords();
  const b = shell("Memory"), res = [], m0 = sess.mastered.length;
  const cards = shuffle(list.flatMap(w => [{w, side:"de"}, {w, side:"en"}]));
  let open = [], lock = false, moves = 0, found = 0;
  b.innerHTML = `<p class="center muted" style="margin-bottom:14px">Finde zu jedem deutschen Wort das englische. ${list.length} Paare!</p>
    <div class="mem-grid">${cards.map((c, k) => `<button class="mem" data-i="${k}" aria-label="Karte ${k+1}"></button>`).join("")}</div>`;
  $("#dots").innerHTML = ""; const cnt = () => $("#gcount").textContent = `Züge: ${moves}`; cnt();
  const face = c => c.side === "de" ? `${c.w.emoji?`<span class="mpic">${pic(c.w)}</span>`:""}<span>${esc(c.w.de)}</span>` : `<span>${esc(firstEn(c.w))}</span>`;
  b.querySelectorAll(".mem").forEach(el => el.onclick = () => {
    const c = cards[+el.dataset.i];
    if (lock || el.classList.contains("up") || el.classList.contains("done")) return;
    sfx("tick");
    el.classList.add("up"); if (c.side === "en") el.classList.add("en-side"); el.innerHTML = face(c);
    if (c.side === "en") sayWord(c.w);
    open.push(el);
    if (open.length === 2){
      moves++; cnt();
      const [a, z] = open.map(o => cards[+o.dataset.i]);
      if (a.w.key === z.w.key){
        open.forEach(o => { o.classList.add("done"); o.setAttribute("aria-label", "gefunden"); });
        sfx("match"); burst(open[1], praise());
        record(a.w, true, false); res.push({w:a.w, ok:true}); found++; open = [];
        if (found === list.length){ confetti(null, 34); later(() => finish("Memory", res, gMemory, m0), 1000); }
      } else {
        lock = true;
        later(() => { sfx("buzz"); open.forEach(o => { o.classList.remove("up","en-side"); o.innerHTML = ""; }); open = []; lock = false; }, 1100);
      }
    }
  });
}

/* 8 · Ballon-Platzen: sechs Ballons steigen auf, der richtige muss angetippt werden, bevor er oben verschwindet */
function gBalloon(){
  const list = pick(8); if (!list.length) return noWords();
  const pool = words().length >= 6 ? words() : words(true);
  if (pool.length < 3) return noWords();
  const b = shell("Ballon-Platzen"), res = [], m0 = sess.mastered.length; let i = 0;
  const step = () => {
    if (i >= list.length) return finish("Ballon-Platzen", res, gBalloon, m0);
    const w = list[i]; dots(res, list.length);
    const opts = shuffle([w, ...shuffle(pool.filter(x => x.key !== w.key)).slice(0, 5)]), n = opts.length;
    const lanes = shuffle(opts.map((_, k) => k)), colors = shuffle(BALLOON_COLORS);
    const base = Math.max(6, 8.5 - i * 0.3);                       /* wird von Wort zu Wort schneller */
    const delays = [0, 0.6, 1.2, 0.3, 0.9, 1.5], extra = [0, 0.8, -0.4, 1.1, 0.4, -0.2];
    b.innerHTML = `<div class="big-prompt">${promptHTML(w)}</div>
      <div class="sky-area" id="sky">
        <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
        ${opts.map((o, k) => `<button class="balloon" type="button" data-k="${esc(o.key)}" style="left:${((lanes[k] + 0.5) * 100 / n).toFixed(1)}%;width:min(${(92 / n).toFixed(1)}%,135px);--c:${colors[k % 6]};--dur:${(base + extra[k]).toFixed(2)}s;--delay:${delays[k]}s">
            <span class="b-body"><span class="b-txt">${esc(firstEn(o))}</span></span><span class="b-knot"></span><span class="b-string"></span></button>`).join("")}
      </div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    const t = gtok;
    let done = false, mistake = false;
    const end = (ok, msg) => {
      if (done) return; done = true;
      record(w, ok, false); res.push({w, ok});
      later(() => sayWord(w), 350);
      b.querySelectorAll(".balloon").forEach(x => { if (x.dataset.k !== w.key) x.classList.add("gone"); });
      $("#fb").className = "fb big " + (ok ? "good" : "bad"); $("#fb").innerHTML = msg;
      later(() => { i++; step(); }, ok ? 1300 : 2400);
    };
    b.querySelectorAll(".balloon").forEach(btn => {
      btn.onclick = () => {
        if (done || btn.classList.contains("miss")) return;
        const body = btn.querySelector(".b-body");
        if (btn.dataset.k === w.key){
          sfx("pop"); setTimeout(() => sfx("right"), 90);
          burst(body, mistake ? "Found it!" : "Correct!"); confetti(body, 20);
          btn.classList.add("popped");
          end(!mistake, mistake ? `Good! <span class="muted">${esc(w.de)} =</span> ${esc(showEn(w))}` : esc(praise()));
        } else {
          mistake = true; sfx("pop"); setTimeout(() => sfx("buzz"), 80);
          burst(body, "Oops!", "bad"); btn.classList.add("miss");
        }
      };
      if (btn.dataset.k === w.key) btn.addEventListener("animationend", e => {
        if (e.animationName !== "rise" || t !== gtok || done) return;
        btn.classList.add("escaped"); sfx("wrong");
        end(false, `Bye bye! <span class="muted">${esc(w.de)} =</span> ${esc(showEn(w))}`);
      });
    });
  };
  step();
}

async function teacherLoad(pin){

const fmtDay = t => new Date(t).toLocaleDateString("de-AT", {weekday:"short", day:"2-digit", month:"2-digit"});
function serialize(units){ return units.map(u => `# ${u.title}\n` + u.words.map(w => `${w[0]} = ${w[1]}${w[2] ? " = "+w[2] : ""}`).join("\n")).join("\n\n"); }
function parseVocab(text){
  const units = []; let u = null;
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if (!line) continue;
    if (line.startsWith("#")){ u = {title: line.replace(/^#+\s*/, "") || "Unit", words: []}; units.push(u); continue; }
    const p = line.split(/\s*(?:=|\t|;)\s*/);
    if (p.length < 2 || !p[0] || !p[1]) continue;
    if (!u){ u = {title: "Vokabeln", words: []}; units.push(u); }
    u.words.push([p[0], p[1], p[2] || ""]);
  }
  return units.filter(x => x.words.length);
}
/* ---------- Aufnehmen ---------- */
let recState = null;   // {key, rec, stream, timer}
function stopRecording(save){
  if (!recState) return;
  const r = recState; recState = save ? r : null;
  clearTimeout(r.timer);
  try { if (r.rec && r.rec.state !== "inactive") r.rec.stop(); } catch(e){}
  if (!save){ try { r.stream.getTracks().forEach(t => t.stop()); } catch(e){} }
}
function recMime(){
  if (typeof MediaRecorder === "undefined") return null;
  const list = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/aac", "audio/webm;codecs=opus", "audio/webm"];
  for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch(e){} }
  return "";
}
function blobToB64(blob){ return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = no; r.readAsDataURL(blob); }); }
async function startRecording(w, onState){
  unlockAudio();
  stopRecording(false);
  const mime = recMime();
  if (mime === null || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ onState("error", "Dieses Gerät kann im Browser nicht aufnehmen. Bitte am iPad mit Safari aufnehmen."); return; }
  onState("wait");
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}); }
  catch(e){ onState("error", "Kein Zugriff aufs Mikrofon. Bitte in Safari erlauben (aA-Symbol in der Adressleiste → Website-Einstellungen → Mikrofon)."); return; }
  const opts = {audioBitsPerSecond: 32000}; if (mime) opts.mimeType = mime;
  let rec; try { rec = new MediaRecorder(stream, opts); } catch(e){ rec = new MediaRecorder(stream); }
  const chunks = [];
  recState = {key: w.key, rec, stream, timer: null};
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstart = () => { onState("rec"); recState.timer = setTimeout(() => stopRecording(true), 4000); };
  rec.onstop = async () => {
    try { stream.getTracks().forEach(t => t.stop()); } catch(e){}
    recState = null;
    const type = rec.mimeType || mime || "audio/mp4";
    const blob = new Blob(chunks, {type});
    if (blob.size < 500){ onState("error", "Die Aufnahme ist leer. Bitte nochmal versuchen."); return; }
    const data = await blobToB64(blob);
    if (data.length > 48000){ onState("error", "Die Aufnahme ist zu lang. Bitte nur das Wort sprechen."); return; }
    onState("save");
    try {
      const r = await api("saveAudio", {pin: teacherPin, key: w.key, mime: type, data});
      cfg.audio = Object.assign({}, cfg.audio, {[w.key]: r.ver});
      const st = audioStore(); st[w.key] = {ver: r.ver, mime: type, data}; local.set("vz_audio", st);
      onState("done");
      sayWord(w);
    } catch(e){ onState("error", errText(e)); }
  };
  rec.start();
}
